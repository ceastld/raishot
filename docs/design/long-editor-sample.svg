    <path d="M202 48V77" stroke="#4c5450"/>
    <text x="224" y="70" fill="#b9bcb1" font-size="17" letter-spacing="5">日常形态</text>
    <g fill="#8c9690" font-size="15"><text x="702" y="69">空间</text><text x="786" y="69">物件</text><text x="870" y="69">生活</text><text x="962" y="69">订阅</text></g>
    <path d="M70 108H1010" stroke="#343d38"/>
    <text x="70" y="166" fill="#c0a577" font-size="14" letter-spacing="3">SPACE JOURNAL · VOL. 028</text>
    <text x="70" y="245" fill="#eeece2" font-size="62" font-weight="550" letter-spacing="3">让光，慢一点。</text>
    <text x="73" y="288" fill="#a9b0a5" font-size="18">一间安静的房子，如何重新定义日常。</text>
    <text x="796" y="282" fill="#78867e" font-size="14">文 / 林间　　8 分钟阅读</text>
