      <g fill="#6f8069" font-size="14"><text x="79" y="365">醒来 · 一杯清水</text><text x="302" y="365">工作 · 专注片刻</text><text x="540" y="365">阅读 · 午后小憩</text><text x="768" y="365">相聚 · 慢慢晚餐</text></g>
    </g>
    <g fill="#abb3a9" font-size="19"><text x="72" y="3780">设计最终要回到生活。留一点空白，接受一点不完美，</text><text x="72" y="3817">也许就是一个家最好的样子。</text></g>
    <text x="72" y="3882" fill="#78867b" font-size="14">摄影 / 周野　　空间 / 山隐设计　　地点 / 杭州</text>
