    <text x="70" y="696" fill="#6f7d74" font-size="13">午后 3:20，光从西南方向进入起居室。</text>
    <text x="957" y="696" fill="#6f7d74" font-size="13">01 / 06</text>
    <text x="70" y="796" fill="#c0a577" font-size="15" letter-spacing="2">01 — LIGHT</text>
    <text x="70" y="852" fill="#e5e6db" font-size="38" font-weight="500">留白，给光一个入口</text>
    <g fill="#abb3a9" font-size="19">
      <text x="72" y="908">好的空间，不急于填满每一处角落。我们把靠窗的位置空出来，</text>
      <text x="72" y="945">让一天之中的光线，成为房间里最自然的变化。</text>
      <text x="72" y="1001">墙面没有过多装饰。木头、石材与一张舒适的椅子，已经足够。</text>
    </g>
