    <g fill="#6f7d74" font-size="13"><text x="70" y="2652">陶 / 木 / 织物　　自然材料的三种表情</text><text x="957" y="2652">03 / 06</text></g>
    <path d="M70 2730H1010" stroke="#343d38"/>
    <text x="82" y="2821" fill="#c0a577" font-size="60" font-family="Georgia, serif">“</text>
    <text x="134" y="2815" fill="#d8dacc" font-size="29">真正的质感，来自愿意被使用的日常。</text>
    <text x="135" y="2864" fill="#78867b" font-size="15">— 空间设计师，陈未</text>
    <path d="M70 2942H1010" stroke="#343d38"/>
    <text x="70" y="3060" fill="#c0a577" font-size="15" letter-spacing="2">03 — EVERYDAY</text>
    <text x="70" y="3116" fill="#e5e6db" font-size="38" font-weight="500">生活，才是空间的尺度</text>
    <g fill="#abb3a9" font-size="19"><text x="72" y="3174">不必把家布置成一张完美的照片。一本翻到一半的书，</text><text x="72" y="3211">一只每天都用的杯子，才是空间最动人的部分。</text></g>
    <g transform="translate(70 3270)">
      <rect width="940" height="432" rx="4" fill="#202a24"/>
      <text x="40" y="57" fill="#d2d8c5" font-size="20">把时间还给自己</text>
      <text x="40" y="87" fill="#778875" font-size="14">一日的光线，也是一日的节奏。</text>
      <path d="M76 296H861" stroke="#455344" stroke-width="1"/>
      <path d="M76 256H861M76 216H861M76 176H861" stroke="#344230" stroke-dasharray="3 9"/>
