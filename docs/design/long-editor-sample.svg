    <g fill="#6f7d74" font-size="13"><text x="70" y="1657">一把椅子，一杯温热的茶。让房间留下一点呼吸的余地。</text><text x="957" y="1657">02 / 06</text></g>
    <path d="M70 1724H1010" stroke="#343d38"/>
    <text x="70" y="1842" fill="#c0a577" font-size="15" letter-spacing="2">02 — TEXTURE</text>
    <text x="70" y="1898" fill="#e5e6db" font-size="38" font-weight="500">材料，让时间有了触感</text>
    <g fill="#abb3a9" font-size="19"><text x="72" y="1956">我们偏爱那些会慢慢变化的材料。木纹的深浅、陶器的细孔，</text><text x="72" y="1993">以及亚麻折叠后留下的痕迹，都让一件物品有了自己的故事。</text></g>
