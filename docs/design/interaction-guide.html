'use strict';
const data=JSON.parse(document.getElementById('guide-data').textContent);
const $=id=>document.getElementById(id), esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const asText=value=>Array.isArray(value)?value.join('；'):typeof value==='object'&&value?Object.values(value).join('；'):String(value??'');
const icons={global:'⌘','capture-before':'⌖',capture:'▣',annotation:'✎','text-edit':'T','image-editor':'▧',pin:'◇','long-capture':'↧','long-crop':'↕',dialogs:'⋯',recording:'●','recording-markup':'✎','recording-preview':'▷',recognition:'文','ocr-editor':'≡',main:'☷',settings:'⚙','qr-translation':'▦'};
const state={mode:'scenes',scene:data.scenes[0]?.id,point:0,flow:0,key:'Enter',query:''};
const shortcuts=data.scenes.flatMap(s=>(s.shortcuts||[]).map(r=>({...r,scene:s})));
const interactions=data.scenes.flatMap(s=>(s.interactions||[]).map((r,i)=>({...r,scene:s,index:i})));
const presets=['Esc','Enter','Space','Ctrl+C','Ctrl+S','Ctrl+Shift+S','Ctrl+Z','Ctrl+0','F1','F2','F5','Delete','Tab','1','H','E'];
const chordLabel=k=>String(k).replace(/\s*\+\s*/g,'+');
const norm=k=>chordLabel(k).toLowerCase().replace(/control/g,'ctrl').replace(/escape/g,'esc').replace(/return/g,'enter').replace(/空格/g,'space').replace(/delete/g,'del').replace(/backspace/g,'back').replace(/arrowleft/g,'left').replace(/arrowright/g,'right').replace(/arrowup/g,'up').replace(/arrowdown/g,'down').replace(/方向键/g,'方向').replace(/\s/g,'');
function expandChord(value){const text=norm(value).replace(/按住/g,'').replace(/←/g,'left').replace(/→/g,'right').replace(/↑/g,'up').replace(/↓/g,'down').replace(/左右/g,'left/right').replace(/方向/g,'up/down/left/right').replace(/导航键/g,'up/down/left/right/home/end/pageup/pagedown');const alternatives=text.split(/[、/／|]/);let inherited='';return alternatives.flatMap((part,index)=>{const prefix=part.match(/^((?:(?:ctrl|alt|shift|win)\+)*)/)[0];if(index===0)inherited=prefix;const mods=prefix||inherited;const base=prefix?part.slice(prefix.length):part;const ordered=['ctrl','alt','shift','win'].filter(m=>mods.includes(m+'+')).map(m=>m+'+').join('');const range=base.match(/^([0-9])[–—~～-]([0-9])$/);return range?Array.from({length:Math.max(0,+range[2]-+range[1]+1)},(_,i)=>ordered+(+range[1]+i)):[ordered+base];});}
function keyMatch(key,actual){const queries=expandChord(key),choices=expandChord(actual);return queries.some(k=>choices.includes(k));}
function chord(keys){return (Array.isArray(keys)?keys:[keys]).map(k=>{const bits=String(k).split(/\s*\+\s*/).filter(Boolean);if(String(k).endsWith('+'))bits.push('+');return '<span class="key-group">'+bits.map(t=>'<kbd>'+esc(t)+'</kbd>').join('<span class="muted">+</span>')+'</span>';}).join('<span class="or">/</span>');}
function source(value){return value?'<details class="source"><summary>源码依据</summary><code>'+esc(asText(value))+'</code></details>':'';}
function matching(item,query){const {scene,...fields}=item;return norm(JSON.stringify({...fields,scene:scene?.title||''})).includes(norm(query));}
function sceneById(id){return data.scenes.find(s=>s.id===id)||data.scenes[0];}
function goScene(id){state.scene=id;state.point=0;state.mode='scenes';state.query='';$('search').value='';render();window.scrollTo({top:0,behavior:'instant'});}
function renderNav(){ $('scene-nav').innerHTML=data.scenes.map(s=>'<button data-scene="'+esc(s.id)+'" aria-current="'+(state.scene===s.id&&state.mode==='scenes'?'page':'false')+'"><span class="nav-icon" aria-hidden="true">'+esc(icons[s.id]||'·')+'</span><span>'+esc(s.title)+'</span><span class="count">'+(s.shortcuts||[]).length+'</span></button>').join('');}
function rows(records,withScene=false){if(!records.length)return '<div class="empty">没有匹配的操作。试试动作名，或选择另一个按键。</div>';return '<div class="table-shell"><table><thead><tr>'+(withScene?'<th>场景</th>':'')+'<th>快捷键 / 手势</th><th>动作</th><th>适用条件与结果</th></tr></thead><tbody>'+records.map(r=>'<tr>'+(withScene?'<td><button class="scene-link" data-scene="'+esc(r.scene.id)+'">'+esc(r.scene.title)+' →</button></td>':'')+'<td class="chord">'+chord(r.keys)+'</td><td class="action">'+esc(r.action)+'</td><td class="condition">'+esc(asText(r.when))+(r.detail?'<div class="extra">'+esc(asText(r.detail))+'</div>':'')+source(r.source)+'</td></tr>').join('')+'</tbody></table></div>';}
function pointDetail(s,index){const p=s.interactions?.[index];if(!p)return '<div class="point-detail"><h3>查看快捷键表</h3><p class="muted">此场景的按键与前置条件列在下方。</p></div>';return '<div class="point-detail" id="point-detail"><span class="detail-number">INTERACTION / '+String(index+1).padStart(2,'0')+'</span><h2>'+esc(p.name)+'</h2><div class="gesture">'+esc(asText(p.gesture))+'</div><p>'+esc(asText(p.result))+'</p>'+source(p.source)+'</div>';}
function renderScene(){const s=sceneById(state.scene);if(!s)return '<div class="empty">场景数据加载中。</div>';const points=s.interactions||[];state.point=Math.max(0,Math.min(state.point,points.length-1));const point=(p,i)=>'<button class="point '+(i===state.point?'active':'')+'" data-point="'+i+'" aria-pressed="'+(i===state.point)+'"><i>'+String(i+1).padStart(2,'0')+'</i>'+esc(p.name)+'</button>';const warning=s.id==='global'?'这里只显示默认全局组合；用户可在设置中修改或禁用。快捷动作没有统一默认热键。':s.id==='pin'?'工具栏展开、收起和文字输入时，按键路由不同；请同时看“适用条件”。':'文字输入、弹层与正在进行的手势优先处理按键；Esc 的结果取决于当前状态。';return '<div class="section-head"><div><h2>'+esc(s.title)+'</h2><p class="scene-summary">'+esc(s.summary)+'</p></div><span class="tag">'+(s.shortcuts||[]).length+' 组快捷操作 · '+points.length+' 个交互点</span></div><div class="notice"><span aria-hidden="true">↳</span>'+esc(warning)+'</div>'+(points.length?'<div class="map-grid"><div class="map"><div class="map-title"><span>交互入口索引 · 点击查看行为</span><span class="dots" aria-hidden="true">···</span></div><div class="map-canvas"><div class="selection"><div class="selection-caption">'+esc(s.title)+' / 操作示意</div>'+points.slice(0,4).map((p,i)=>point(p,i)).join('')+'</div><div class="mini-toolbar">'+points.slice(4,9).map((p,i)=>point(p,i+4)).join('')+'</div></div></div>'+pointDetail(s,state.point)+'</div>':'')+'<div class="subhead"><h3>快捷键对应关系</h3><span>按条件解释实际行为</span></div>'+rows((s.shortcuts||[]).map(r=>({...r,scene:s})))+(points.length?'<div class="subhead"><h3>全部可交互点</h3><span>鼠标、工具栏、菜单与参数</span></div><div class="interaction-list">'+points.map((p,i)=>'<button class="interaction-item" data-point="'+i+'" aria-pressed="'+(i===state.point)+'"><span class="n">'+String(i+1).padStart(2,'0')+'</span><span><span class="caption">'+esc(p.name)+'</span><small>'+esc(asText(p.gesture))+'</small></span></button>').join('')+'</div>':'');}
function renderKeys(){const records=shortcuts.filter(r=>(r.keys||[]).some(k=>keyMatch(state.key,k)));return '<div class="key-picker"><h2>这个键，在不同场景做什么？</h2><div class="key-presets">'+presets.map(k=>'<button data-key="'+esc(k)+'" aria-pressed="'+(norm(k)===norm(state.key))+'">'+esc(k)+'</button>').join('')+'</div><div class="key-entry"><input id="key-input" aria-label="输入要查询的按键组合" value="'+esc(state.key)+'" placeholder="例如 Ctrl+Shift+S"><button id="lookup-key">查询</button><input id="key-capture" readonly aria-label="点击后按键查询" placeholder="或点这里按键查询"><span>只在此输入框内捕获；系统热键可能由 Windows 接管。</span></div></div><div class="reverse-head">'+chord([state.key])+'<span>在 '+new Set(records.map(r=>r.scene.id)).size+' 个场景中匹配 '+records.length+' 条规则</span></div>'+rows(records,true);}
function renderFlows(){if(!data.flows.length)return '<div class="empty">暂无输出流向数据。</div>';state.flow=Math.min(state.flow,data.flows.length-1);const f=data.flows[state.flow];return '<div class="section-head"><div><h2>一次输出，走到哪里？</h2><p class="scene-summary">复制、快速保存、另存、贴图和历史记录是不同的出口。</p></div></div><div class="flow-layout"><nav class="flow-nav" aria-label="输出行为">'+data.flows.map((f,i)=>'<button data-flow="'+i+'" aria-pressed="'+(state.flow===i)+'">'+esc(f.title)+'</button>').join('')+'</nav><div class="flow-main"><h2>'+esc(f.title)+'</h2><div class="flow-track"><div class="flow-node"><small>来源</small><h3>'+esc(asText(f.from))+'</h3></div><div class="arrow" aria-hidden="true">→</div><div class="flow-node destination"><small>去向</small><h3>'+esc(asText(f.to))+'</h3></div></div><div class="flow-trigger">触发：'+esc(asText(f.trigger))+'</div><div class="flow-condition"><strong>条件与边界</strong>'+esc(asText(f.conditions))+'</div><p class="flow-detail">'+esc(asText(f.detail))+'</p>'+source(f.source)+'</div></div>';}
function renderStorage(){return '<div class="section-head"><div><h2>本地数据位置</h2><p class="scene-summary">展示源码约定的默认位置；页面不会读取本机配置或文件。</p></div><span class="tag">'+data.storage.length+' 类数据</span></div><p class="storage-intro">%LOCALAPPDATA% 通常指当前用户的本地应用数据目录；%USERPROFILE% 指用户目录。环境变量或设置中的路径可覆盖相应默认值。</p><div class="storage-list">'+data.storage.map((s,i)=>'<details class="storage-card" '+(i<3?'open':'')+'><summary><h3>'+esc(s.title)+'</h3></summary><code class="storage-path">'+esc(asText(s.path))+'</code><p><b>存什么：</b>'+esc(asText(s.contents))+'</p><p><b>何时写入：</b>'+esc(asText(s.when))+'</p>'+source(s.source)+'</details>').join('')+'</div>';}
function renderSearch(){const q=state.query;const keys=shortcuts.filter(r=>matching(r,q)),points=interactions.filter(r=>matching(r,q)),flows=data.flows.filter(r=>matching(r,q)),storage=data.storage.filter(r=>matching(r,q));const total=keys.length+points.length+flows.length+storage.length;return '<div class="section-head"><div><h2>搜索全部场景</h2><p class="scene-summary">“'+esc(q)+'” · '+total+' 条匹配</p></div><button id="exit-search">返回当前场景</button></div>'+(keys.length?'<div class="subhead"><h3>快捷键</h3><span>'+keys.length+' 条</span></div>'+rows(keys,true):'')+(points.length?'<div class="subhead"><h3>交互点</h3><span>'+points.length+' 个</span></div><div class="interaction-list">'+points.map(p=>'<button class="interaction-item" data-result-scene="'+esc(p.scene.id)+'" data-result-point="'+p.index+'"><span class="n">↗</span><span><span class="caption">'+esc(p.name)+'</span><small>'+esc(p.scene.title)+' · '+esc(asText(p.gesture))+'</small><small>'+esc(asText(p.result))+'</small></span></button>').join('')+'</div>':'')+(flows.length?'<div class="subhead"><h3>输出流向</h3></div><div class="interaction-list">'+flows.map(f=>'<button class="interaction-item" data-flow-result="'+data.flows.indexOf(f)+'"><span><span class="caption">'+esc(f.title)+'</span><small>'+esc(asText(f.to))+'</small></span></button>').join('')+'</div>':'')+(storage.length?'<div class="subhead"><h3>本地数据</h3></div>'+storage.map(s=>'<div class="storage-card"><h3>'+esc(s.title)+'</h3><code class="storage-path">'+esc(asText(s.path))+'</code><p>'+esc(asText(s.contents))+'</p>'+source(s.source)+'</div>').join(''):'')+(!total?'<div class="empty">没有匹配结果。可试试“复制”“长截图”“Ctrl+S”或“history”。</div>':'');}
function notes(){return '<details class="audit-notes"><summary>口径与已知差异</summary><ul><li>以当前事件路由为准，帮助说明可能滞后：长截图 Enter / ✓ 为完成并复制；裁剪入口打开长图调整窗。</li><li>贴图工具栏展开时，数字键走工具选择；收起时走图像处理。Ctrl+0 在展开状态也可能被工具路由拦截，中键仍可恢复 100%。</li><li>默认只列固定组合与可配置入口。用户自定义快捷动作按本机设置生效，不为其假定默认组合。</li><li>截图历史默认关闭；录屏输出、贴图工作区与截图历史各自保存，不等同于快速保存目录。</li><li>场景拆分服务于查询；同一窗口中的焦点、弹层、编辑或采集状态仍会影响行为。源码依据可逐行展开。</li></ul></details>';}
function render(){renderNav();$('coverage').innerHTML='<div><strong>'+data.scenes.length+'</strong><span>场景</span></div><div><strong>'+shortcuts.length+'</strong><span>快捷规则</span></div><div><strong>'+interactions.length+'</strong><span>交互点</span></div>';$('clear-search').hidden=!state.query;$('search-scope').textContent=state.query?'全场景搜索':'搜索覆盖全部场景';document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.mode===state.mode)));$('content').setAttribute('aria-labelledby','tab-'+state.mode);$('content').innerHTML=(state.query?renderSearch():({scenes:renderScene,keys:renderKeys,flows:renderFlows,storage:renderStorage}[state.mode])())+notes();}
function clearQuery(){state.query='';$('search').value='';render();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.scene){goScene(b.dataset.scene);return;}if(b.dataset.mode){state.mode=b.dataset.mode;clearQuery();return;}if(b.dataset.point!==undefined){state.point=+b.dataset.point;render();$('point-detail')?.scrollIntoView({block:'nearest',behavior:'instant'});return;}if(b.dataset.key!==undefined){state.key=b.dataset.key;render();return;}if(b.dataset.flow!==undefined){state.flow=+b.dataset.flow;render();return;}if(b.dataset.resultScene){state.scene=b.dataset.resultScene;state.point=+b.dataset.resultPoint;state.mode='scenes';clearQuery();window.scrollTo({top:0,behavior:'instant'});return;}if(b.dataset.flowResult!==undefined){state.flow=+b.dataset.flowResult;state.mode='flows';clearQuery();return;}if(b.id==='lookup-key'){state.key=$('key-input').value.trim()||'Enter';render();return;}if(['clear-search','exit-search'].includes(b.id))clearQuery();});
$('search').addEventListener('input',e=>{state.query=e.target.value.trim();render();});
document.addEventListener('keydown',e=>{if(e.target.id==='key-input'&&e.key==='Enter'){e.preventDefault();state.key=e.target.value.trim()||'Enter';render();return;}if(e.target.id==='key-capture'){if(e.key==='Tab')return;e.preventDefault();if(['Control','Alt','Shift','Meta'].includes(e.key))return;const key={Escape:'Esc',' ':'Space',ArrowLeft:'Left',ArrowRight:'Right',ArrowUp:'Up',ArrowDown:'Down'}[e.key]||(e.key.length===1?e.key.toUpperCase():e.key);state.key=[e.ctrlKey?'Ctrl':'',e.altKey?'Alt':'',e.shiftKey?'Shift':'',e.metaKey?'Win':'',key].filter(Boolean).join('+');render();$('key-capture').focus();}});
function readHash(){const hash=location.hash.slice(1);if(['keys','flows','storage'].includes(hash)){state.mode=hash;state.query='';$('search').value='';render();}else if(data.scenes.some(s=>s.id===hash))goScene(hash);}
window.addEventListener('hashchange',readHash);render();readHash();
})();
</script>
</body></html>
