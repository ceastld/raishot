<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图库工具原型</title>
<style>
/* 工具并入图库原型：页面即主窗口。深色优先，跟随系统；配色沿用 design/main-window.html。 */
:root {
  --page: #171b21; --side: #13171c; --card: #20262e; --raised: #2a313a; --line: #2f3741; --track: #191d23;
  --nav-hover: #1f252c; --nav-sel: #27303a; --fg: #d9e2e9; --muted: #8997a6; --faint: #5d6977; --border: #3d4651;
  --hover: #2a323c; --accent: #40ce9d; --accent-soft: rgba(64,206,157,.16); --on-accent: #0d1f18;
  --warn: #e6b450; --danger: #ef6b6b; --menu: #252c35; --screen: #0e1115; --scrim: rgba(0,0,0,.62);
  --shadow: 0 12px 32px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
  --ui: "Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --page: #f3f6f9; --side: #eaeff3; --card: #ffffff; --raised: #ffffff; --line: #e3e8ed; --track: #eef2f5;
  --nav-hover: #e1e8ee; --nav-sel: #d8e1e8; --fg: #374351; --muted: #667482; --faint: #9aa6b2; --border: #dce3e9;
  --hover: #eaf0f3; --accent: #126d4e; --accent-soft: rgba(18,109,78,.1); --on-accent: #ffffff;
  --warn: #a8740c; --danger: #c43d3d; --menu: #ffffff; --screen: #dfe5ea; --scrim: rgba(20,30,40,.45);
  --shadow: 0 12px 32px rgba(30,45,60,.16), 0 2px 6px rgba(30,45,60,.1); color-scheme: light; } }
:root[data-theme="light"] {
  --page: #f3f6f9; --side: #eaeff3; --card: #ffffff; --raised: #ffffff; --line: #e3e8ed; --track: #eef2f5;
  --nav-hover: #e1e8ee; --nav-sel: #d8e1e8; --fg: #374351; --muted: #667482; --faint: #9aa6b2; --border: #dce3e9;
  --hover: #eaf0f3; --accent: #126d4e; --accent-soft: rgba(18,109,78,.1); --on-accent: #ffffff;
  --warn: #a8740c; --danger: #c43d3d; --menu: #ffffff; --screen: #dfe5ea; --scrim: rgba(20,30,40,.45);
  --shadow: 0 12px 32px rgba(30,45,60,.16), 0 2px 6px rgba(30,45,60,.1); color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--page); color: var(--fg); font: 14px/1.45 var(--ui); overflow: hidden; user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, select { font: inherit; color: inherit; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

.app { display: grid; grid-template-columns: 200px 1fr; grid-template-rows: 40px 1fr; height: 100vh; }
.titlebar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding-left: 16px; border-bottom: 1px solid var(--line); background: var(--side); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; width: 184px; flex: none; }
.brand .logo { width: 18px; height: 18px; border-radius: 5px; background: linear-gradient(135deg, var(--accent), #2a8bd6); }
.titlebar .spacer { flex: 1; }
.proto-tag { font-size: 11px; color: var(--faint); }
.theme-switch { display: flex; gap: 2px; padding: 2px; background: var(--track); border-radius: 6px; border: 1px solid var(--line); }
.theme-switch button { font-size: 12px; padding: 1px 8px; border-radius: 4px; color: var(--muted); }
.theme-switch button.on { background: var(--nav-sel); color: var(--fg); }
.winbtns { display: flex; height: 100%; }
.winbtns span { width: 46px; display: grid; place-items: center; color: var(--muted); }

.side { background: var(--side); border-right: 1px solid var(--line); padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.nav { height: 36px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 6px; font-weight: 600; width: 100%; text-align: left; }
.nav:hover { background: var(--nav-hover); }
.nav.on { background: var(--nav-sel); }
.nav.on::before { content: ""; position: absolute; margin-left: -12px; width: 3px; height: 16px; border-radius: 2px; background: var(--accent); }
.nav .n { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 400; }
.side .sub { font-size: 12px; color: var(--faint); padding: 14px 12px 4px; }
.nav.small { height: 32px; font-weight: 400; color: var(--muted); }
.nav.gone { text-decoration: line-through; color: var(--faint); font-weight: 400; cursor: default; }
.nav.gone:hover { background: none; }
.nav.gone .n { font-size: 11px; text-decoration: none; }

.main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.toolbar { display: flex; align-items: center; gap: 8px; padding: 12px 20px 10px; }
.chips { display: flex; gap: 2px; padding: 2px; background: var(--track); border: 1px solid var(--line); border-radius: 7px; }
.chips button { padding: 3px 12px; border-radius: 5px; font-size: 13px; color: var(--muted); }
.chips button .c { font-size: 11px; color: var(--faint); margin-left: 4px; }
.chips button.on { background: var(--nav-sel); color: var(--fg); }
.search { width: 220px; height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-radius: 7px; background: var(--track); border: 1px solid var(--line); color: var(--muted); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 13px; }
.toolbar .spacer { flex: 1; }
.btn { height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--border); background: var(--card); font-size: 13px; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--hover); }
.btn.icon { width: 30px; padding: 0; justify-content: center; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn .chev { width: 12px; height: 12px; opacity: .7; }

.banner { margin: 0 20px 10px; display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 14px; border-radius: 10px; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); }
.banner .bi { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); }
.banner .bt { font-weight: 600; }
.banner .bs { color: var(--muted); font-size: 13px; }
.banner .count { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--fg); font-size: 13px; }
.banner .count b { color: var(--accent); }

.body { flex: 1; display: flex; min-height: 0; }
.scroll { flex: 1; overflow-y: auto; padding: 0 20px 90px; min-width: 0; }
.day { font-size: 12px; color: var(--muted); font-weight: 600; padding: 10px 0 8px; position: sticky; top: 0; background: var(--page); z-index: 2; display: flex; gap: 8px; align-items: center; }
.day .tag { font-weight: 400; color: var(--faint); }
.day .tag button { color: var(--accent); }
.grid { display: flex; flex-wrap: wrap; gap: 8px; }
.card { position: relative; height: 128px; border-radius: 8px; overflow: hidden; background: var(--screen); outline: 2px solid transparent; outline-offset: 2px; cursor: default; flex: none; transition: opacity .15s, transform .1s; }
.card:hover { outline-color: var(--border); }
.card.sel { outline-color: var(--accent); }
.card.dim { opacity: .28; pointer-events: none; }
.card .badge { position: absolute; left: 6px; bottom: 6px; font-size: 11px; padding: 0 6px; border-radius: 4px; background: rgba(0,0,0,.6); color: #fff; display: flex; gap: 4px; align-items: center; }
.card .badge .dot { width: 6px; height: 6px; border-radius: 3px; background: #40ce9d; }
.card .order { position: absolute; right: 6px; top: 6px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.card .check { position: absolute; right: 6px; top: 6px; width: 20px; height: 20px; border-radius: 10px; border: 2px solid rgba(255,255,255,.85); background: rgba(0,0,0,.35); }
.card .hoverbar { position: absolute; right: 6px; bottom: 6px; display: none; gap: 4px; }
.card:hover .hoverbar { display: flex; }
.card .hoverbar button { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; background: rgba(15,18,22,.78); color: #fff; }
.card .hoverbar button:hover { background: rgba(15,18,22,.95); }

/* 假截图：像素内容不随主题变化 */
.fx { position: absolute; inset: 0; background: hsl(var(--h) 18% 15%); }
.fx i { position: absolute; display: block; border-radius: 2px; }
.fx.win .bar { left: 0; right: 0; top: 0; height: 9%; background: hsl(var(--h) 16% 22%); }
.fx.win .sb { left: 0; top: 9%; bottom: 0; width: 22%; background: hsl(var(--h) 16% 19%); }
.fx.win .l { left: 28%; height: 5%; background: hsl(var(--h) 12% 40%); }
.fx.win .l1 { top: 18%; width: 46%; } .fx.win .l2 { top: 28%; width: 60%; background: hsl(var(--h) 10% 32%); } .fx.win .l3 { top: 38%; width: 38%; background: hsl(var(--h) 10% 32%); }
.fx.win .blk { left: 28%; right: 6%; top: 52%; bottom: 8%; background: hsl(var(--h) 55% 45% / .55); }
.fx.code { background: #1b1f27; }
.fx.code i { height: 5%; left: 8%; }
.fx.chart { background: #f0f2f4; }
.fx.chart i { bottom: 12%; width: 10%; background: hsl(var(--h) 60% 50%); }
.fx.chart .ax { left: 8%; right: 6%; bottom: 12%; height: 1px; width: auto; background: #b9c0c7; }
.fx.doc { background: #dfe3e7; }
.fx.doc i { left: 12%; height: 4%; background: #9aa3ad; }
.fx.doc .h { height: 7%; background: hsl(var(--h) 45% 40%); }
.fx.vid { background: linear-gradient(160deg, hsl(var(--h) 35% 22%), #0d1014); }
.fx.vid .play { left: 50%; top: 50%; width: 30%; aspect-ratio: 1; max-width: 46px; transform: translate(-50%,-50%); border-radius: 50%; background: rgba(255,255,255,.18); }
.fx.vid .play::after { content: ""; position: absolute; left: 40%; top: 30%; border-left: 12px solid rgba(255,255,255,.9); border-top: 8px solid transparent; border-bottom: 8px solid transparent; }
.fx.bar { background: #fbfbfb; }
.fx.bar i { top: 22%; bottom: 30%; background: #111; }
.fx img, .card > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

.detail { width: 290px; flex: none; border-left: 1px solid var(--line); padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.detail .pv { position: relative; width: 100%; border-radius: 8px; overflow: hidden; background: var(--screen); }
.detail h3 { margin: 0; font-size: 15px; font-weight: 600; }
.facts { font-size: 12px; display: grid; grid-template-columns: 56px 1fr; gap: 4px 10px; }
.facts span:nth-child(odd) { color: var(--muted); }
.actions { display: flex; flex-direction: column; gap: 6px; }
.actions .row { display: flex; flex-wrap: wrap; gap: 6px; }
.actions .row .btn { flex: 1; justify-content: center; }
.empty { color: var(--muted); font-size: 13px; display: flex; flex-direction: column; gap: 10px; }
.empty .tip { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); }
.empty .tip .ic { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.empty .tip b { color: var(--fg); font-weight: 600; }
.stack { position: relative; height: 150px; }
.stack .card { position: absolute; width: 170px; height: 110px; left: 50%; top: 18px; box-shadow: var(--shadow); }

.actionbar { position: absolute; left: 50%; bottom: 18px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; display: flex; align-items: center; gap: 6px; padding: 7px 8px 7px 14px; border-radius: 12px; background: var(--menu); border: 1px solid var(--border); box-shadow: var(--shadow); transition: .18s; z-index: 5; white-space: nowrap; }
.actionbar.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.actionbar .cnt { font-weight: 600; margin-right: 6px; }
.actionbar .cnt small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.actionbar .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }

.menu { position: fixed; z-index: 30; min-width: 280px; padding: 6px; border-radius: 10px; background: var(--menu); border: 1px solid var(--border); box-shadow: var(--shadow); display: none; }
.menu.show { display: block; }
.menu .mh { font-size: 11px; color: var(--faint); padding: 6px 10px 4px; }
.menu .mi { width: 100%; display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 6px; text-align: left; }
.menu .mi:hover { background: var(--hover); }
.menu .mi .nm { flex: 1; }
.menu .mi .st { font-size: 12px; color: var(--faint); }
.menu .mi.ready .st { color: var(--accent); }
.menu .mi.need { color: var(--muted); }
.menu .mi.need svg { opacity: .6; }
.menu .msep { height: 1px; background: var(--line); margin: 6px 4px; }
.menu kbd { font: 11px var(--ui); color: var(--faint); }

/* 工具弹层 */
.overlay { position: absolute; inset: 0; z-index: 20; background: var(--page); display: none; flex-direction: column; }
.overlay.show { display: flex; animation: rise .16s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
.ohead { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.ohead .title { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; padding: 4px 8px; border-radius: 6px; }
.ohead .title.switch:hover { background: var(--hover); }
.ohead .spacer { flex: 1; }
.strip { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); overflow-x: auto; min-height: 76px; }
.strip .lbl { font-size: 12px; color: var(--muted); margin-right: 4px; flex: none; }
.chip { position: relative; width: 84px; height: 54px; border-radius: 6px; overflow: hidden; flex: none; background: var(--screen); outline: 1px solid var(--line); cursor: grab; }
.chip.drag { opacity: .4; }
.chip.over { outline: 2px solid var(--accent); }
.chip .no { position: absolute; left: 4px; top: 4px; font-size: 11px; font-weight: 700; min-width: 16px; height: 16px; border-radius: 8px; background: rgba(0,0,0,.65); color: #fff; display: grid; place-items: center; padding: 0 4px; }
.chip .rm { position: absolute; right: 3px; top: 3px; width: 18px; height: 18px; border-radius: 9px; background: rgba(0,0,0,.65); color: #fff; display: none; place-items: center; }
.chip:hover .rm { display: grid; }
.chip .rm svg { width: 11px; height: 11px; }
.addchip { width: 84px; height: 54px; border-radius: 6px; border: 1px dashed var(--border); color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; flex: none; }
.addchip:hover { border-color: var(--accent); color: var(--accent); }
.obody { flex: 1; display: flex; min-height: 0; }
.stage { flex: 1; min-width: 0; display: grid; place-items: center; padding: 24px; background: var(--screen); overflow: auto; position: relative; }
.opts { width: 260px; flex: none; border-left: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
.opt label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.seg { display: flex; gap: 2px; padding: 2px; background: var(--track); border: 1px solid var(--line); border-radius: 7px; }
.seg button { flex: 1; padding: 4px 0; border-radius: 5px; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--nav-sel); color: var(--fg); }
.opt input[type=range] { width: 100%; accent-color: var(--accent); }
.opt input[type=text], .opt input[type=number], .opt select, .opt textarea { width: 100%; height: 30px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--track); outline: 0; }
.opt textarea { height: 80px; padding: 6px 8px; resize: none; font: inherit; }
.opt .hint { font-size: 12px; color: var(--faint); margin-top: 6px; }
.box { position: relative; background: var(--screen); border-radius: 4px; overflow: hidden; }
.shot { position: relative; overflow: hidden; border-radius: 3px; flex: none; }

/* 各工具预览 */
.collage { display: flex; background: var(--bg, #fff); padding: var(--gap); gap: var(--gap); box-shadow: var(--shadow); }
.collage.col { flex-direction: column; }
.collage.grid { display: grid; grid-template-columns: repeat(2, auto); }
.pages { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
.page { width: 150px; aspect-ratio: 210/297; background: #f4f5f6; box-shadow: var(--shadow); display: grid; place-items: center; padding: 14px; position: relative; }
.page .shot { width: 100%; }
.page .pn { position: absolute; bottom: -20px; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--muted); }
.cmp { position: relative; width: min(760px, 90%); aspect-ratio: 16/10; border-radius: 6px; overflow: hidden; box-shadow: var(--shadow); }
.cmp .layer { position: absolute; inset: 0; }
.cmp .rhs { clip-path: inset(0 0 0 var(--cut)); }
.cmp .knob { position: absolute; top: 0; bottom: 0; left: var(--cut); width: 2px; background: var(--accent); }
.cmp .knob::after { content: "⇆"; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 28px; height: 28px; border-radius: 14px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: 14px; }
.cmp .lab { position: absolute; top: 8px; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: rgba(0,0,0,.6); color: #fff; }
.splitgrid { position: absolute; inset: 0; display: grid; }
.splitgrid div { border: 1px dashed rgba(64,206,157,.95); display: grid; place-items: center; color: #fff; font-size: 12px; text-shadow: 0 1px 2px #000; }
.measure-line { position: absolute; left: 22%; top: 30%; width: 48%; height: 2px; background: var(--warn); transform-origin: left center; transform: rotate(18deg); }
.measure-line::before, .measure-line::after { content: ""; position: absolute; top: -4px; width: 10px; height: 10px; border-radius: 5px; border: 2px solid var(--warn); background: rgba(0,0,0,.4); }
.measure-line::before { left: -6px; } .measure-line::after { right: -6px; }
.measure-tag { position: absolute; left: 44%; top: 34%; font-size: 12px; padding: 2px 6px; border-radius: 4px; background: rgba(0,0,0,.75); color: #fff; }
.swatch { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); font-size: 13px; }
.swatch i { width: 28px; height: 28px; border-radius: 6px; flex: none; }
.found { position: absolute; border: 2px solid var(--accent); border-radius: 3px; box-shadow: 0 0 0 9999px rgba(0,0,0,.35); }
.result { padding: 10px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); font-size: 13px; }
.result code { font-size: 14px; color: var(--accent); }
.qr { width: 220px; height: 220px; display: grid; grid-template-columns: repeat(21, 1fr); background: #fff; padding: 12px; box-shadow: var(--shadow); }
.qr i { background: #fff; } .qr i.k { background: #111; }
.trim { position: absolute; left: 24px; right: 24px; bottom: 18px; height: 34px; border-radius: 6px; background: rgba(255,255,255,.08); }
.trim .sel { position: absolute; top: 0; bottom: 0; left: 18%; right: 34%; border: 2px solid var(--accent); border-radius: 6px; background: var(--accent-soft); }
.batch-list { width: min(620px, 95%); display: flex; flex-direction: column; gap: 6px; }
.batch-row { display: flex; align-items: center; gap: 12px; padding: 6px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); font-size: 13px; }
.batch-row .shot { width: 72px; height: 44px; }
.batch-row .arrow { color: var(--faint); }
.batch-row .out { color: var(--muted); }

.toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--menu); border: 1px solid var(--border); box-shadow: var(--shadow); padding: 8px 14px; border-radius: 8px; font-size: 13px; display: none; z-index: 40; }
.toast.show { display: block; animation: rise .16s ease-out; }
.dropzone { position: absolute; inset: 8px; z-index: 25; border: 2px dashed var(--accent); border-radius: 12px; background: color-mix(in srgb, var(--page) 80%, transparent); display: none; place-items: center; font-size: 15px; color: var(--accent); font-weight: 600; }
.dropzone.show { display: grid; }
.notes { position: fixed; right: 16px; bottom: 16px; width: 300px; padding: 12px 14px; border-radius: 10px; background: var(--menu); border: 1px solid var(--border); box-shadow: var(--shadow); font-size: 12px; color: var(--muted); z-index: 50; }
.notes b { color: var(--fg); }
.notes ol { margin: 6px 0 0; padding-left: 18px; }
.notes .x { position: absolute; right: 8px; top: 6px; color: var(--faint); }
</style>
</head>

<script>
const $ = s => document.querySelector(s);
const ic = (n, cls = 'i') => `<svg class="${cls}"><use href="#i-${n}"/></svg>`;

// —— 假数据：今天 / 昨天，截图、贴图、录屏混排 ——
const ITEMS = [
  { id: 'a', kind: 'shot', day: '今天', t: '11:42', title: '订单后台 · Edge', app: 'msedge.exe', w: 1600, h: 900, v: 'win', hue: 210 },
  { id: 'b', kind: 'shot', day: '今天', t: '11:40', title: '订单后台 · Edge', app: 'msedge.exe', w: 1600, h: 900, v: 'win', hue: 200 },
  { id: 'c', kind: 'pin', day: '今天', t: '11:21', title: 'main.rs 片段', app: 'Code.exe', w: 820, h: 620, v: 'code', hue: 0, live: true },
  { id: 'd', kind: 'rec', day: '今天', t: '10:58', title: '复现步骤录屏', app: '录屏', w: 1920, h: 1080, v: 'vid', hue: 260, dur: '0:42' },
  { id: 'e', kind: 'shot', day: '今天', t: '10:30', title: '周报图表', app: 'EXCEL.EXE', w: 1200, h: 800, v: 'chart', hue: 150 },
  { id: 'f', kind: 'shot', day: '今天', t: '10:12', title: '发票条码', app: 'Acrobat.exe', w: 900, h: 420, v: 'bar', hue: 0 },
  { id: 'g', kind: 'shot', day: '今天', t: '09:47', title: '需求文档第 3 页', app: 'WINWORD.EXE', w: 700, h: 980, v: 'doc', hue: 220 },
  { id: 'h', kind: 'shot', day: '今天', t: '09:46', title: '需求文档第 4 页', app: 'WINWORD.EXE', w: 700, h: 980, v: 'doc', hue: 12 },
  { id: 'i', kind: 'pin', day: '昨天', t: '18:05', title: '配色参考', app: 'Figma.exe', w: 1000, h: 700, v: 'win', hue: 330 },
  { id: 'j', kind: 'shot', day: '昨天', t: '17:33', title: '错误弹窗', app: 'explorer.exe', w: 640, h: 360, v: 'win', hue: 0 },
  { id: 'k', kind: 'rec', day: '昨天', t: '16:20', title: '演示 GIF 素材', app: '录屏', w: 1280, h: 720, v: 'vid', hue: 170, dur: '0:12' },
  { id: 'l', kind: 'shot', day: '昨天', t: '15:02', title: '终端输出', app: 'WindowsTerminal.exe', w: 1100, h: 700, v: 'code', hue: 0 },
  { id: 'm', kind: 'shot', day: '昨天', t: '14:41', title: '设计稿 A', app: 'Figma.exe', w: 1440, h: 900, v: 'win', hue: 40 },
  { id: 'n', kind: 'shot', day: '昨天', t: '14:40', title: '设计稿 B', app: 'Figma.exe', w: 1440, h: 900, v: 'win', hue: 48 },
];
const KIND_NAME = { shot: '截图', pin: '贴图', rec: '录屏', ext: '外部文件' };
const isImg = it => it.kind !== 'rec';

// —— 工具注册表：一处声明，图库操作条、菜单、详情栏、弹层共用 ——
const TOOLS = [
  { id: 'view', name: '查看', icon: 'view', acc: 'any', min: 1, max: 1, mode: 'popup' },
  { id: 'pin', name: '贴出', icon: 'pin', acc: 'img', min: 1, max: 99, mode: 'direct' },
  { id: 'edit', name: '编辑', icon: 'edit', acc: 'img', min: 1, max: 1, mode: 'direct' },
  { id: 'ocr', name: '识别文字', icon: 'ocr', acc: 'img', min: 1, max: 1, mode: 'direct' },
  { id: 'compare', name: '对照', icon: 'compare', acc: 'img', min: 2, max: 2, mode: 'popup', group: 'multi' },
  { id: 'collage', name: '拼接', icon: 'collage', acc: 'img', min: 2, max: 99, mode: 'popup', group: 'multi' },
  { id: 'pdf', name: '转 PDF', icon: 'pdf', acc: 'img', min: 1, max: 99, mode: 'popup', group: 'multi' },
  { id: 'batch', name: '批量导出', icon: 'batch', acc: 'img', min: 1, max: 99, mode: 'popup', group: 'multi', sub: '格式、尺寸、水印' },
  { id: 'split', name: '分割', icon: 'split', acc: 'img', min: 1, max: 1, mode: 'popup', group: 'single' },
  { id: 'measure', name: '取色与测量', icon: 'measure', acc: 'img', min: 1, max: 1, mode: 'popup', group: 'single' },
  { id: 'barcode', name: '识别条码', icon: 'barcode', acc: 'img', min: 1, max: 1, mode: 'popup', group: 'single' },
  { id: 'gif', name: '转 GIF', icon: 'gif', acc: 'vid', min: 1, max: 1, mode: 'popup', group: 'video' },
  { id: 'qr', name: '生成二维码', icon: 'qr', acc: 'none', min: 0, max: 0, mode: 'popup' },
];
const T = Object.fromEntries(TOOLS.map(t => [t.id, t]));

const S = {
  filter: 'all', sel: [], anchor: null, pick: null, // pick: { tool, sel, add: bool }
  popup: null, // { tool, src: [ids], opts: {} }
  external: [],
};

const all = () => [...S.external, ...ITEMS];
const byId = id => all().find(x => x.id === id);
function summary(ids) {
  const items = ids.map(byId).filter(Boolean);
  return { items, img: items.filter(isImg).length, vid: items.filter(x => !isImg(x)).length, n: items.length };
}
function availability(tool, sm) {
  if (tool.acc === 'none') return { ok: true };
  if (tool.acc === 'vid') return sm.vid === 1 && sm.img === 0 ? { ok: true } : { ok: false, need: '选 1 段录屏' };
  if (tool.acc === 'any') return sm.n === 1 ? { ok: true } : { ok: false, need: '选 1 项' };
  const n = sm.img;
  if (n < tool.min) return { ok: false, need: tool.min === tool.max ? `选 ${tool.min} 张图片` : `至少 ${tool.min} 张图片` };
  if (n > tool.max) return { ok: false, need: tool.max === 1 ? '只用 1 张图片' : `只用 ${tool.max} 张图片` };
  return { ok: true, partial: sm.vid > 0 ? `${n} 张图片` : '' };
}
function recommended(sm) {
  if (sm.n === 0) return [];
  if (sm.vid === 1 && sm.img === 0) return ['view', 'gif'];
  if (sm.vid > 0 && sm.img === 0) return [];
  if (sm.img === 1 && sm.vid === 0) return ['pin', 'edit', 'ocr'];
  if (sm.img === 2) return ['compare', 'collage'];
  return ['collage', 'pdf', 'batch'];
}
const accepts = (tool, it) => tool.acc === 'any' || (tool.acc === 'vid' ? !isImg(it) : isImg(it));

// —— 渲染：假截图 ——
function thumb(it) {
  if (it.url) return `<img src="${it.url}" alt="">`;
  const h = it.hue;
  const inner = {
    win: '<i class="bar"></i><i class="sb"></i><i class="l l1"></i><i class="l l2"></i><i class="l l3"></i><i class="blk"></i>',
    code: [14, 22, 30, 38, 46, 54, 62, 70, 78].map((y, k) => `<i style="top:${y}%;left:${8 + (k % 3) * 6}%;width:${30 + (k * 17) % 45}%;background:${['#c678dd', '#61afef', '#98c379', '#e5c07b', '#abb2bf'][k % 5]}"></i>`).join(''),
    chart: '<i class="ax"></i>' + [30, 55, 42, 70, 62, 84].map((v, k) => `<i style="left:${12 + k * 14}%;height:${v * .7}%"></i>`).join(''),
    doc: '<i class="h" style="top:10%;width:50%"></i>' + [22, 28, 34, 40, 50, 56, 62, 68, 78, 84].map((y, k) => `<i style="top:${y}%;width:${60 + (k * 13) % 18}%"></i>`).join(''),
    vid: '<i class="play"></i>',
    bar: [10, 13, 15, 19, 22, 23, 27, 31, 33, 36, 40, 43, 44, 48, 52, 55, 57, 61, 64, 66, 70, 74, 77, 79, 83, 86, 88].map((x, k) => `<i style="left:${x}%;width:${k % 3 ? 1 : 2}%"></i>`).join(''),
  }[it.v] || '';
  return `<div class="fx ${it.v}" style="--h:${h}">${inner}</div>`;
}
function shot(it, w, h) {
  const style = h ? `width:${w}px;height:${h}px` : `width:${w}px;aspect-ratio:${it.w}/${it.h}`;
  return `<div class="shot" style="${style}">${thumb(it)}</div>`;
}

// —— 渲染：图库 ——
function renderChips() {
  const c = k => all().filter(x => k === 'all' || x.kind === k).length;
  $('#chips').innerHTML = [['all', '全部'], ['shot', '截图'], ['pin', '贴图'], ['rec', '录屏']]
    .map(([k, n]) => `<button data-f="${k}" class="${S.filter === k ? 'on' : ''}">${n}<span class="c">${c(k)}</span></button>`).join('');
}
function visible() {
  return all().filter(x => S.filter === 'all' || x.kind === S.filter || x.kind === 'ext');
}
function renderGrid() {
  const sel = S.pick ? S.pick.sel : S.sel;
  const days = [];
  for (const it of visible()) {
    const d = it.kind === 'ext' ? '外部文件' : it.day;
    let g = days.find(x => x.d === d);
    if (!g) days.push(g = { d, items: [] });
    g.items.push(it);
  }
  $('#scroll').innerHTML = days.map(g => `
    <div class="day">${g.d}${g.d === '外部文件' ? '<span class="tag">仅本次窗口，不写入历史 · <button onclick="clearExternal()">移除</button></span>' : ''}</div>
    <div class="grid">${g.items.map(it => {
      const w = Math.round(128 * Math.min(2.2, Math.max(.6, it.w / it.h)));
      const k = sel.indexOf(it.id);
      const dim = S.pick && S.pick.tool.acc !== 'none' && !accepts(S.pick.tool, it);
      const mark = S.pick ? (k >= 0 ? `<span class="order">${k + 1}</span>` : '<span class="check"></span>')
        : (k >= 0 && sel.length > 1 ? `<span class="order">${k + 1}</span>` : '');
      const badge = it.kind === 'rec' ? `<span class="badge">▶ ${it.dur}</span>`
        : it.kind === 'pin' ? `<span class="badge">${it.live ? '<span class="dot"></span>屏幕上' : '已关闭'}</span>`
        : it.kind === 'ext' ? `<span class="badge">${it.title}</span>` : '';
      const hover = S.pick ? '' : `<div class="hoverbar">${isImg(it)
        ? `<button title="贴出" data-q="pin">${ic('pin')}</button><button title="复制" data-q="copy">${ic('copy')}</button>`
        : `<button title="播放" data-q="view">${ic('view')}</button>`}</div>`;
      return `<div class="card ${k >= 0 ? 'sel' : ''} ${dim ? 'dim' : ''}" data-id="${it.id}" style="width:${w}px">${thumb(it)}${badge}${mark}${hover}</div>`;
    }).join('')}</div>`).join('');
}
function renderDetail() {
  const el = $('#detail');
  if (S.pick) {
    const t = S.pick.tool, sm = summary(S.pick.sel);
    el.innerHTML = `<div class="empty"><div class="tip"><span class="ic">${ic(t.icon)}</span><div><b>${t.name}</b><br>${needText(t)}</div></div>
      ${S.pick.sel.length ? `<div>${t.id === 'compare' ? '1 在左、2 在右' : t.id === 'pdf' ? '已选顺序就是页序' : '已选顺序就是排列顺序'}，进入后还能拖动调整。</div>` : '<div>按住 Ctrl 不需要：选择模式下单击即可加入或移出。</div>'}
      ${sm.items.map((it, k) => `<div style="display:flex;gap:8px;align-items:center">${shot(it, 64, 40)}<span>${k + 1}. ${it.title}</span></div>`).join('')}</div>`;
    return;
  }
  const sm = summary(S.sel);
  if (sm.n === 0) {
    el.innerHTML = `<div class="empty">
      <div style="font-weight:600;color:var(--fg)">选中截图，工具就在手边</div>
      ${[['collage', '选 2 张以上', '拼接、转 PDF、批量导出'], ['compare', '选 2 张', '同步缩放对照差异'], ['measure', '选 1 张', '分割、取色测量、识别条码'], ['gif', '选 1 段录屏', '播放、转 GIF']]
        .map(([i, a, b]) => `<div class="tip"><span class="ic">${ic(i)}</span><div><b>${a}</b><br>${b}</div></div>`).join('')}
      <div>或者点右上“工具”，先选工具再挑图。外部图片直接拖进窗口。</div></div>`;
    return;
  }
  if (sm.n > 1) {
    el.innerHTML = `<div class="stack">${sm.items.slice(0, 3).reverse().map((it, k, a) => `<div class="card" style="transform:translateX(-50%) rotate(${(a.length - 1 - k) * -4 + 4}deg) translateY(${k * -4}px)">${thumb(it)}</div>`).join('')}</div>
      <h3>已选 ${sm.n} 项</h3><div class="facts"><span>图片</span><span>${sm.img} 张</span><span>录屏</span><span>${sm.vid} 段</span></div>
      <div class="empty">角标是选择顺序，拼接与 PDF 默认按它排列。动作在底部操作条。</div>`;
    return;
  }
  const it = sm.items[0];
  el.innerHTML = `<div class="pv" style="aspect-ratio:${it.w}/${it.h}">${thumb(it)}</div>
    <h3>${it.title}</h3>
    <div class="facts"><span>类型</span><span>${KIND_NAME[it.kind]}</span><span>时间</span><span>${it.day || '本次'} ${it.t || ''}</span><span>尺寸</span><span>${it.w} × ${it.h}</span><span>来源</span><span>${it.app || '拖入的文件'}</span></div>
    <div class="actions">${actionButtons(sm, true)}</div>`;
}
function actionButtons(sm, vertical) {
  const rec = recommended(sm);
  const btns = rec.map((id, k) => toolBtn(T[id], sm, k === 0 ? 'primary' : '')).join('');
  const more = `<button class="btn ${vertical ? '' : 'ghost'}" data-menu="tools">${ic('tools')}${rec.length ? '更多工具' : '工具'}${ic('chev', 'i chev')}</button>`;
  if (!vertical) return btns + more;
  return `<div class="row">${btns}</div><div class="row">${more}</div>
    <div class="row"><button class="btn ghost" data-act="copy">${ic('copy')}复制</button><button class="btn ghost" data-act="del">${ic('trash')}删除</button></div>`;
}
function toolBtn(t, sm, cls) {

const isFileDrag = e => [...(e.dataTransfer?.types || [])].includes('Files');
addEventListener('dragenter', e => { if (!isFileDrag(e)) return; dragDepth++; $('#dropzone').classList.add('show'); });
addEventListener('dragleave', e => { if (!isFileDrag(e)) return; if (--dragDepth <= 0) $('#dropzone').classList.remove('show'); });
addEventListener('dragover', e => { if (isFileDrag(e)) e.preventDefault(); });
addEventListener('drop', e => {
  if (!isFileDrag(e)) return; e.preventDefault(); dragDepth = 0; $('#dropzone').classList.remove('show');
  const files = [...e.dataTransfer.files].filter(f => f.type.startsWith('image/'));
  if (!files.length) { toast('原型只演示图片文件'); return; }
  let left = files.length; const ids = [];
  files.forEach((f, k) => {
    const url = URL.createObjectURL(f), img = new Image(), id = 'x' + Date.now() + k;
    img.onload = () => {
      S.external.push({ id, kind: 'ext', title: f.name, w: img.naturalWidth, h: img.naturalHeight, url, v: 'win', hue: 0 }); ids.push(id);
      if (--left === 0) { S.sel = ids; S.anchor = ids[0]; S.pick = null; S.popup = null; render(); toast(`已加入 ${ids.length} 个外部文件并选中`); }
    };
    img.src = url;
  });
});
function clearExternal() { S.external.forEach(x => URL.revokeObjectURL(x.url)); S.sel = S.sel.filter(id => !S.external.some(x => x.id === id)); S.external = []; render(); }
// 主题
document.getElementById('theme').addEventListener('click', e => {
  const t = e.target.dataset.t; if (!t) return;
  document.querySelectorAll('#theme button').forEach(b => b.classList.toggle('on', b === e.target));
  if (t === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = t;
});
render();
</script>
</body>
</html>
