<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>托盘弹层 · 设计预览</title>
<style>
/* 托盘右键弹层原型：深色优先，跟随系统；配色沿用主界面原型（GPUI Palette）。 */
:root{color-scheme:dark;
  --page:#121416;--stage:#191c20;--grid:#ffffff04;--taskbar:#1c1f23f2;--taskbar-line:#2b3036;
  --pop:#20252b;--pop-line:#363d46;--section:#1a1e23;--hover:#2b323a;--press:#323a43;--line:#2f363e;
  --fg:#dce2e8;--muted:#8b95a1;--faint:#5f6874;--kbd:#2a3038;--kbd-line:#3a424c;
  --accent:#40ce9d;--accent-soft:#40ce9d24;--on-accent:#0c1f18;--warn:#ddbb7c;--warn-soft:#ddbb7c1f;--danger:#f18b8b;--danger-soft:#f18b8b1c;
  --shadow:0 18px 48px #0009,0 2px 8px #0006;--thumb-a:#2f3b47;--thumb-b:#3c4a3f;--thumb-c:#473a3a;--thumb-ink:#ffffff30;
  --native:#2b2b2b;--native-line:#404040;--native-hover:#3d3d3d;--native-fg:#f0f0f0;--native-muted:#a0a0a0;
  --ui:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",system-ui,sans-serif}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;
  --page:#edf0f2;--stage:#d9dee2;--grid:#00000005;--taskbar:#f3f4f6f2;--taskbar-line:#d5d9dd;
  --pop:#fbfcfd;--pop-line:#d7dce1;--section:#f2f4f6;--hover:#e8ecef;--press:#dfe4e8;--line:#e2e6ea;
  --fg:#2f3842;--muted:#6f7883;--faint:#a0a8b1;--kbd:#eef1f3;--kbd-line:#d6dbe0;
  --accent:#21825f;--accent-soft:#21825f1c;--on-accent:#fff;--warn:#99701f;--warn-soft:#99701f18;--danger:#b84242;--danger-soft:#b8424214;
  --shadow:0 18px 48px #2634422e,0 2px 8px #2634421c;--thumb-a:#c9d4de;--thumb-b:#cfdccf;--thumb-c:#e0d0cc;--thumb-ink:#00000024;
  --native:#f9f9f9;--native-line:#dcdcdc;--native-hover:#e8e8e8;--native-fg:#1a1a1a;--native-muted:#6b6b6b}}
:root[data-theme="light"]{color-scheme:light;
  --page:#edf0f2;--stage:#d9dee2;--grid:#00000005;--taskbar:#f3f4f6f2;--taskbar-line:#d5d9dd;
  --pop:#fbfcfd;--pop-line:#d7dce1;--section:#f2f4f6;--hover:#e8ecef;--press:#dfe4e8;--line:#e2e6ea;
  --fg:#2f3842;--muted:#6f7883;--faint:#a0a8b1;--kbd:#eef1f3;--kbd-line:#d6dbe0;
  --accent:#21825f;--accent-soft:#21825f1c;--on-accent:#fff;--warn:#99701f;--warn-soft:#99701f18;--danger:#b84242;--danger-soft:#b8424214;
  --shadow:0 18px 48px #2634422e,0 2px 8px #2634421c;--thumb-a:#c9d4de;--thumb-b:#cfdccf;--thumb-c:#e0d0cc;--thumb-ink:#00000024;
  --native:#f9f9f9;--native-line:#dcdcdc;--native-hover:#e8e8e8;--native-fg:#1a1a1a;--native-muted:#6b6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--fg);font:13px/1.5 var(--ui)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
button:disabled{cursor:default}
.page{max-width:1180px;margin:auto;padding:28px 32px 40px}
.heading{display:flex;align-items:baseline;gap:12px;margin-bottom:18px}
h1{margin:0;font-size:20px;font-weight:500;letter-spacing:.02em}
.caption{font-size:12px;color:var(--muted)}
.controls{display:flex;gap:18px 22px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.control-label{color:var(--muted);margin-right:8px;font-size:12px}
.switch{display:inline-flex;gap:3px;padding:3px;background:var(--pop);border:1px solid var(--line);border-radius:8px;flex-wrap:wrap}
.switch button{height:27px;border:0;border-radius:5px;padding:0 11px;background:transparent;color:var(--muted);font-size:12px}
.switch button:hover{color:var(--fg)}
.switch button.on{background:var(--hover);color:var(--fg)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
/* 舞台：假桌面 + 任务栏，弹层贴着托盘图标向上展开 */
.stage{position:relative;height:800px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background-color:var(--stage);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px}
.taskbar{position:absolute;left:0;right:0;bottom:0;height:48px;background:var(--taskbar);border-top:1px solid var(--taskbar-line);display:flex;align-items:center;justify-content:flex-end;padding:0 10px;gap:4px}
.tray-icon{width:32px;height:32px;border:0;border-radius:5px;background:transparent;display:grid;place-items:center;color:var(--muted)}
.tray-icon:hover,.tray-icon.open{background:var(--hover)}
.tray-icon.app{color:var(--accent)}
.clock{font-size:11px;line-height:15px;text-align:right;color:var(--fg);padding:0 6px 0 8px;font-variant-numeric:tabular-nums}
.stage-hint{position:absolute;left:18px;top:14px;font-size:12px;color:var(--muted)}
.size-readout{position:absolute;left:18px;bottom:60px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.toast{position:absolute;left:50%;top:22px;transform:translateX(-50%);background:var(--pop);border:1px solid var(--pop-line);border-radius:7px;padding:6px 12px;font-size:12px;box-shadow:var(--shadow);white-space:nowrap}
.toast[hidden]{display:none}
.icon{width:18px;height:18px;flex:none;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* 弹层本体 */
.popup{position:absolute;right:62px;bottom:56px;width:344px;background:var(--pop);border:1px solid var(--pop-line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;
  transform-origin:bottom right;animation:rise .14s cubic-bezier(.2,.8,.3,1)}
.popup[hidden],.native[hidden]{display:none}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.head{display:flex;align-items:center;gap:9px;padding:10px 12px 9px 14px}
.brand-mark{width:22px;height:22px;border-radius:6px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.brand-mark .icon{width:15px;height:15px;stroke-width:2.2}
.brand{font-weight:600;font-size:13px}
.status{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);border:0;background:transparent;padding:3px 7px;border-radius:5px;max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status:hover{background:var(--hover);color:var(--fg)}
.status .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.status.warn{color:var(--warn)}.status.warn .dot{background:var(--warn)}
.section{padding:4px 8px 8px}
.section+.section{border-top:1px solid var(--line);padding-top:8px}
.section-head{display:flex;align-items:center;gap:8px;padding:2px 6px 5px;font-size:11px;color:var(--muted);min-height:24px}
.section-head .meta{margin-left:auto;font-variant-numeric:tabular-nums}
.link{border:0;background:transparent;color:var(--muted);font-size:11px;padding:2px 6px;border-radius:4px;display:inline-flex;align-items:center;gap:2px}
.link:hover{color:var(--fg);background:var(--hover)}
.link .icon{width:12px;height:12px}
kbd{font:11px/1 var(--ui);font-variant-numeric:tabular-nums;color:var(--muted);background:var(--kbd);border:1px solid var(--kbd-line);border-bottom-width:2px;border-radius:4px;padding:2px 5px;white-space:nowrap}
.hero{width:100%;display:flex;align-items:center;gap:11px;border:0;border-radius:8px;height:40px;padding:0 10px;background:var(--accent-soft);text-align:left}
.hero:hover{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.hero .icon{color:var(--accent);width:22px;height:22px}
.hero .title{font-weight:600}
.hero .sub{font-size:11px;color:var(--muted);margin-left:-3px}
.hero kbd{margin-left:auto}
.tiles{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:4px;margin-top:4px}
.tile{border:0;background:transparent;border-radius:7px;padding:7px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.tile:hover{background:var(--hover)}
.tile .icon{width:20px;height:20px;color:var(--fg)}
.tile .name{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tile .info{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tile.proposed .name:after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--warn);margin-left:4px;vertical-align:2px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.chip{border:0;background:transparent;border-radius:6px;height:38px;padding:0 8px;display:flex;align-items:center;gap:8px;min-width:0;text-align:left}
.chip .text{display:flex;flex-direction:column;min-width:0;flex:1;line-height:15px}
.chip .key{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip:hover{background:var(--hover)}
.chip .icon{width:16px;height:16px;color:var(--muted)}
.chip .name{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumbs{display:flex;gap:6px;padding:0 6px}
.thumb{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:5px;padding:0;position:relative;overflow:hidden;background:var(--thumb-a)}
.thumb:hover{outline:2px solid var(--accent);outline-offset:1px}
.thumb i{position:absolute;left:6px;right:10px;height:3px;border-radius:2px;background:var(--thumb-ink)}
.thumb .badge{position:absolute;right:3px;bottom:3px;font-size:9px;line-height:12px;padding:0 3px;border-radius:3px;background:#0008;color:#fff;font-style:normal}
.empty-note{margin:0 6px;padding:10px 10px;border:1px dashed var(--line);border-radius:7px;font-size:11px;color:var(--muted)}
.row{width:100%;border:0;background:transparent;border-radius:6px;min-height:34px;padding:5px 8px;display:flex;align-items:center;gap:10px;text-align:left}
.row:hover{background:var(--hover)}
.row:disabled{opacity:.42;background:transparent}
.row>.icon{color:var(--muted)}
.row .text{display:flex;flex-direction:column;min-width:0;flex:1}
.row .label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .detail{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.row .mini{width:34px;height:24px;border-radius:3px;border:1px solid var(--line);flex:none;position:relative;overflow:hidden}
.row .mini i{position:absolute;left:4px;right:7px;top:8px;height:2px;background:var(--thumb-ink);border-radius:1px}
.count{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.group-pick{border:0;background:var(--section);border-radius:5px;padding:1px 6px 1px 8px;font-size:11px;color:var(--fg);display:inline-flex;align-items:center;gap:3px}
.group-pick:hover{background:var(--hover)}
.group-pick .icon{width:12px;height:12px}
.controlbar{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin:4px 0 0;padding:3px;border-radius:8px;background:var(--section)}
.ctl{border:0;background:transparent;border-radius:6px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;font-size:11px;color:var(--muted)}
.ctl .icon{width:17px;height:17px;color:var(--fg)}
.ctl:hover{background:var(--hover);color:var(--fg)}
.ctl:disabled{opacity:.38;background:transparent}
.ctl.danger:hover{background:var(--danger-soft);color:var(--danger)}.ctl.danger:hover .icon{color:var(--danger)}
.ctl .pip{position:absolute;top:5px;right:calc(50% - 18px);min-width:15px;height:15px;border-radius:8px;background:var(--warn);color:var(--on-accent);font-size:10px;line-height:15px;padding:0 4px;font-variant-numeric:tabular-nums}
.foot{display:flex;align-items:center;gap:2px;padding:6px 8px;border-top:1px solid var(--line);background:var(--section)}
.foot-btn{border:0;background:transparent;border-radius:6px;height:30px;padding:0 9px;display:flex;align-items:center;gap:7px;font-size:12px}
.foot-btn .icon{width:16px;height:16px;color:var(--muted)}
.foot-btn:hover{background:var(--hover)}
.foot-btn.exit{margin-left:auto;color:var(--muted)}
.foot-btn.exit:hover{color:var(--danger);background:var(--danger-soft)}.foot-btn.exit:hover .icon{color:var(--danger)}
.warnbar{margin:0 8px 6px;padding:7px 9px;border-radius:7px;background:var(--warn-soft);color:var(--warn);font-size:11px;display:flex;gap:8px;align-items:center}
.warnbar button{margin-left:auto;border:0;background:transparent;color:inherit;text-decoration:underline;font-size:11px;padding:0}
/* 原生菜单对照：按 Windows 11 系统菜单比例绘制 */
.native{position:absolute;right:62px;bottom:56px;width:300px;background:var(--native);border:1px solid var(--native-line);border-radius:8px;box-shadow:var(--shadow);padding:4px;color:var(--native-fg);font:12px/1 "Segoe UI","Microsoft YaHei UI",sans-serif}
.native div{display:flex;align-items:center;height:30px;padding:0 10px 0 30px;border-radius:4px}
.native div:hover{background:var(--native-hover)}
.native div span{margin-left:auto;color:var(--native-muted)}
.native div.b{font-weight:600}
.native hr{border:0;border-top:1px solid var(--native-line);margin:4px 2px}
.native div.sub span:after{content:"›";margin-left:8px}
/* 右栏说明 */
.notes{display:flex;flex-direction:column;gap:14px}
.card{background:var(--pop);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card h2{margin:0 0 6px;font-size:13px;font-weight:500}
.card ul{margin:0;padding-left:16px;color:var(--muted);font-size:12px}
.card li{margin:3px 0}
.card li b{color:var(--fg);font-weight:500}
.card p{margin:0;color:var(--muted);font-size:12px}
@media(max-width:980px){.layout{grid-template-columns:1fr}}
@media(max-width:560px){.page{padding:18px 12px}.popup,.native{right:8px;left:8px;width:auto}.stage{height:840px}.clock{display:none}}
@media(prefers-reduced-motion:reduce){.popup{animation:none}}
</style>
</head>
<body>
<main class="page">
  <header class="heading"><h1 id="t-title">托盘弹层</h1><span class="caption" id="t-caption">替换系统右键菜单 · 分区不变、信息更全</span></header>
  <div class="controls">
    <div><span class="control-label" data-t="场景|Scenario">场景</span><div class="switch" id="sw-scenario">
      <button class="on" data-v="normal" data-t="日常|Typical">日常</button><button data-v="fresh" data-t="刚安装|First run">刚安装</button><button data-v="conflict" data-t="热键冲突|Hotkey conflict">热键冲突</button><button data-v="busy" data-t="贴图很多|Many pins">贴图很多</button>
    </div></div>
    <div><span class="control-label" data-t="对照|Compare">对照</span><div class="switch" id="sw-view">
      <button class="on" data-v="popup" data-t="新弹层|New popup">新弹层</button><button data-v="native" data-t="现有菜单|Current menu">现有菜单</button>
    </div></div>
    <div><span class="control-label" data-t="截图入口|Capture entries">截图入口</span><div class="switch" id="sw-extra">
      <button class="on" data-v="1" data-t="+长截图/录屏|+Long/Record">+长截图/录屏</button><button data-v="0" data-t="仅现有|Existing only">仅现有</button>
    </div></div>
    <div><span class="control-label" data-t="语言|Language">语言</span><div class="switch" id="sw-lang">
      <button class="on" data-v="zh">中文</button><button data-v="en">English</button>
    </div></div>
    <div><span class="control-label" data-t="主题|Theme">主题</span><div class="switch" id="sw-theme">
      <button class="on" data-v="system" data-t="跟随系统|System">跟随系统</button><button data-v="dark" data-t="深色|Dark">深色</button><button data-v="light" data-t="浅色|Light">浅色</button>
    </div></div>
  </div>
  <div class="layout">
    <section class="stage" id="stage">
      <span class="stage-hint" data-t="右键托盘图标打开 · ↑↓←→ 移动 · Enter 执行 · Esc 关闭|Right-click the tray icon · arrows move · Enter runs · Esc closes">右键托盘图标打开 · ↑↓←→ 移动 · Enter 执行 · Esc 关闭</span>
      <div class="toast" id="toast" hidden></div>
      <div class="size-readout" id="size"></div>
      <div class="popup" id="popup" role="menu" aria-label="RaiShot"></div>
      <div class="native" id="native" hidden></div>
      <div class="taskbar">
        <button class="tray-icon" tabindex="-1" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>
        <button class="tray-icon app open" id="tray" aria-label="RaiShot"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4.5" width="14" height="11" rx="1.5" stroke-dasharray="2.6 2"/><path d="M14 13l6 6M17 19h3v-3"/></svg></button>
        <button class="tray-icon" tabindex="-1" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></svg></button>
        <div class="clock">14:32<br>2026/10/23</div>
      </div>
    </section>
    <aside class="notes" id="notes"></aside>
  </div>
</main>
<script>
const ICONS={
  region:'<rect x="3" y="4.5" width="14" height="11" rx="1.5" stroke-dasharray="2.6 2"/><path d="M14 13l6 6M17 19h3v-3"/>',
  monitor:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/>',
  monitors:'<rect x="2" y="5" width="9.5" height="8" rx="1.5"/><rect x="12.5" y="5" width="9.5" height="8" rx="1.5"/><path d="M6.75 13v4M17.25 13v4M4.5 17h4.5M15 17h4.5"/>',
  long:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8M8 7h4M8 11h4M8 15h4M19 4v14M16 15l3 3 3-3"/>',
  record:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/>',
  pin:'<g transform="rotate(35 12 12)"><path d="M8 3.5h8M9 3.5v6l-3 4v1h12v-1l-3-4v-6M12 14.5v6"/></g>',

  settings:'<path d="M3 6h2M9 6h12M3 12h11M18 12h3M3 18h5M12 18h9"/><circle cx="7" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="10" cy="18" r="2"/>',
  keyboard:'<rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6.5 10h.01M10 10h.01M14 10h.01M17.5 10h.01M6.5 14h.01M17.5 14h.01M9.5 14h5"/>',
  eye:'<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>',
  eyeoff:'<path d="M3 3l18 18M10 10.1a3 3 0 0 0 4 4M6.6 6.7C4.1 8.3 2.5 12 2.5 12S6 18.5 12 18.5c2 0 3.7-.7 5.1-1.6M10.2 5.7c.6-.1 1.2-.2 1.8-.2 6 0 9.5 6.5 9.5 6.5s-.8 1.5-2.3 3.1"/>',
  through:'<path d="M5 3.5l11 8-4.8.9 2.8 5.7-2.3 1.1-2.8-5.7L5 16.5z"/><path d="M17 16h4M19 14v4"/>',
  close:'<path d="m6 6 12 12M18 6 6 18"/>',
  undo:'<path d="m8 5-4 4 4 4M4 9h9a6 6 0 0 1 0 12h-2"/>',

  const popup=document.getElementById('popup'),native=document.getElementById('native');

// 两种菜单都临时放出来量一次尺寸，便于比较占地。
function measure(){
  const size=el=>{const h=el.hidden;el.hidden=false;const v=h?'hidden':'';el.style.visibility=v;const r=el.getBoundingClientRect();el.hidden=h;el.style.visibility='';return `${Math.round(r.width)} × ${Math.round(r.height)}`};
  document.getElementById('size').textContent=T(`新弹层 ${size(document.getElementById('popup'))} · 现有菜单 ${size(document.getElementById('native'))}`,`New popup ${size(document.getElementById('popup'))} · current menu ${size(document.getElementById('native'))}`);
}

// data() 每次重建快照，就地操作写进 overrides 后再叠加。
const baseData=data;
data=function(){const d=baseData();const o=overrides[S.scenario]||{};if(o.pins)Object.assign(d.pins,o.pins);return d};

let toastTimer;
function toast(text){const t=document.getElementById('toast');t.textContent='→ '+text;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,1600)}
function inPlace(act){
  const d=data(),p=d.pins,o=overrides[S.scenario]=overrides[S.scenario]||{pins:{}};
  if(act==='cycle-group'){const i=p.groups.indexOf(p.group);o.pins.group=p.groups[(i+1)%p.groups.length];return true}
  if(act==='toggle-hide'){const total=p.shown+p.hidden;o.pins.shown=p.shown?0:total;o.pins.hidden=p.shown?total:0;return true}
  if(act==='clear-through'){o.pins.through=0;return true}
  if(act==='close-all'){o.pins.shown=0;o.pins.hidden=0;o.pins.through=0;o.pins.closed={count:(p.closed?p.closed.count:0)+p.shown+p.hidden,t:T('刚刚','Just now'),w:820,h:460};S.open=false;toast(T('已关闭全部贴图（可恢复）','Closed all pins (restorable)'));return true}
  return false;
}
function focusFirst(){const f=document.querySelector('#popup [data-item]:not(:disabled)');f&&f.focus({preventScroll:true})}

document.getElementById('popup').addEventListener('click',e=>{
  const b=e.target.closest('[data-item]');if(!b||b.disabled)return;
  const act=b.dataset.act;
  if(inPlace(act)){const keep=document.activeElement&&document.activeElement.dataset.act;render();if(S.open){const again=[...document.querySelectorAll('#popup [data-item]')].find(x=>x.dataset.act===keep);(again&&!again.disabled?again:null)?.focus({preventScroll:true})}return}
  S.open=false;render();toast(act);
});
document.getElementById('tray').addEventListener('contextmenu',e=>{e.preventDefault();S.open=!S.open;render();if(S.open)focusFirst()});
document.getElementById('tray').addEventListener('click',()=>{S.open=false;render();toast(T('区域截图','Capture region'))});
document.getElementById('stage').addEventListener('mousedown',e=>{if(!e.target.closest('#popup,#native,#tray')&&S.open){S.open=false;render()}});
document.addEventListener('keydown',e=>{
  if(!S.open||S.view!=='popup')return;
  if(e.key==='Escape'){S.open=false;render();document.getElementById('tray').focus();return}
  if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))return;
  const items=[...document.querySelectorAll('#popup [data-item]:not(:disabled)')];
  const cur=document.activeElement;if(!items.includes(cur)){e.preventDefault();focusFirst();return}
  // 按视觉位置找最近的下一个目标，网格和列表用同一套规则。
  const r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let best=null,score=Infinity;
  for(const it of items){if(it===cur)continue;const q=it.getBoundingClientRect(),x=q.left+q.width/2,y=q.top+q.height/2,dx=x-cx,dy=y-cy;
    const ok={ArrowUp:dy<-4,ArrowDown:dy>4,ArrowLeft:dx<-4&&Math.abs(dy)<r.height,ArrowRight:dx>4&&Math.abs(dy)<r.height}[e.key];if(!ok)continue;
    const s=e.key==='ArrowUp'||e.key==='ArrowDown'?Math.abs(dy)*1+Math.abs(dx)*2.5:Math.abs(dx);if(s<score){score=s;best=it}}
  e.preventDefault();best&&best.focus({preventScroll:true});
});
function bindSwitch(id,key,parse=v=>v){document.getElementById(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  S[key]=parse(b.dataset.v);document.querySelectorAll(`#${id} button`).forEach(x=>x.classList.toggle('on',x===b));
  if(key==='theme'){S.theme==='system'?document.documentElement.removeAttribute('data-theme'):document.documentElement.dataset.theme=S.theme}
  if(key==='scenario')delete overrides[S.scenario];
  S.open=true;render()})}
bindSwitch('sw-scenario','scenario');bindSwitch('sw-view','view');bindSwitch('sw-extra','extra',v=>v==='1');bindSwitch('sw-lang','lang');bindSwitch('sw-theme','theme');
// ?scenario=conflict&lang=en&view=native&extra=0&theme=light 直接打开某个状态，便于转发。
for(const [k,id] of [['scenario','sw-scenario'],['view','sw-view'],['extra','sw-extra'],['lang','sw-lang'],['theme','sw-theme']]){const v=new URLSearchParams(location.search).get(k);const b=v&&document.querySelector(`#${id} button[data-v="${v}"]`);if(b)b.click()}
render();
</script>
