<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UIA 选区动画</title>
<style>
:root {
  color-scheme: dark;
  --bg: #15171b;
  --panel: #1e2127;
  --panel-2: #262a31;
  --line: #343943;
  --text: #e6e8eb;
  --muted: #9aa1ab;
  --accent: #1498ff;
  --chip: #2c323b;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #eef0f3;
    --panel: #ffffff;
    --panel-2: #f5f6f8;
    --line: #d9dde3;
    --text: #1d2127;
    --muted: #5d6570;
    --chip: #e8ebef;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font: 13px/1.5 "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  gap: 12px;
  padding: 12px;
}
@media (max-width: 900px) {
  body { grid-template-columns: 1fr; }
}
#stageWrap { position: relative; min-width: 0; }
#stage {
  position: relative;
  width: 1920px;
  height: 1080px;
  transform-origin: 0 0;
  overflow: hidden;
  border-radius: 6px;
  cursor: crosshair;
  user-select: none;
  background: radial-gradient(circle at 20% 15%, #3a4a6b 0, transparent 45%),
              radial-gradient(circle at 85% 80%, #5b3b5e 0, transparent 50%),
              linear-gradient(135deg, #1d2333, #2a2236);
}
#stage .n { position: absolute; overflow: hidden; white-space: nowrap; color: #d8dce2; font-size: 19px; }
.window { background: #20242b; border: 1px solid #3a404a; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
.titlebar { background: #191c22; display: flex; align-items: center; padding-left: 16px; color: #c5cad2 !important; }
.capbtn { display: grid; place-items: center; color: #aab0b9 !important; }
.capbtn.close:hover { background: #c42b1c; }
.sidebar { background: #1b1e24; border-right: 1px solid #2c313a; }
.nav { border-radius: 6px; padding-left: 52px; display: flex; align-items: center; color: #c9ced6 !important; }
.nav::before { content: ""; position: absolute; left: 16px; top: 50%; width: 22px; height: 22px; margin-top: -11px; border-radius: 5px; background: #3b4250; }
.nav.on { background: #2b3240; }
.toolbar { background: #1f232a; border-bottom: 1px solid #2c313a; }
.tbtn { border-radius: 6px; background: #2a2f38; display: grid; place-items: center; color: #b9c0ca !important; font-size: 17px !important; }
.content { background: #22262d; }
.card { background: #282d35; border-radius: 10px; border: 1px solid #333944; }
.h { font-size: 27px !important; font-weight: 600; color: #eef1f5 !important; }
.line { color: #aeb5bf !important; }
.btn { border-radius: 7px; background: #3a4150; display: grid; place-items: center; }
.btn.primary { background: #2b6fd6; color: #fff !important; }
.row { border-bottom: 1px solid #2f343e; }
.check { border: 2px solid #6b7480; border-radius: 4px; }
.tag { border-radius: 12px; background: #2f4a3a; color: #9be0b4 !important; font-size: 16px !important; display: grid; place-items: center; }
.input { background: #1a1d22; border: 1px solid #3d4450; border-radius: 6px; padding-left: 12px; display: flex; align-items: center; color: #7f8792 !important; }
.switch { border-radius: 14px; background: #2b6fd6; }
.switch::after { content: ""; position: absolute; right: 4px; top: 4px; width: 20px; height: 20px; border-radius: 50%; background: #fff; }
.switch.off { background: #4a515d; }
.switch.off::after { right: auto; left: 4px; }
.taskbar { background: rgba(20,22,27,.92); border-top: 1px solid #2d323b; }
.tico { border-radius: 8px; background: #39404c; }
.desk-ico { border-radius: 10px; background: rgba(255,255,255,.12); }
#overlay { position: absolute; inset: 0; pointer-events: none; }

aside {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
  align-self: start;
}
h1 { font-size: 15px; margin: 0; }
.hint { color: var(--muted); font-size: 12px; margin: 0; }
.presets { display: flex; gap: 6px; flex-wrap: wrap; }
button.preset {
  flex: 1;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--text);
  border-radius: 6px;
  padding: 6px 4px;
  font: inherit;
  cursor: pointer;
}
button.preset.on { border-color: var(--accent); color: var(--accent); }
fieldset { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px 10px; margin: 0; display: grid; gap: 8px; }
legend { color: var(--muted); font-size: 12px; padding: 0 4px; }
label.r { display: grid; grid-template-columns: 76px 1fr 46px; align-items: center; gap: 8px; }
label.r output { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
label.c { display: flex; align-items: center; gap: 6px; }
select { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 3px 4px; font: inherit; }
input[type=range] { width: 100%; accent-color: var(--accent); }
#log {
  font: 11.5px/1.55 Consolas, "Cascadia Mono", monospace;
  background: var(--panel-2);
  border-radius: 6px;
  padding: 8px;
  height: 200px;
  overflow: hidden;
  white-space: pre;
  color: var(--muted);
}
#stats { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div id="stageWrap"><div id="stage"><canvas id="overlay" width="1920" height="1080"></canvas></div></div>
<aside>
  <h1>UIA 自动选区动画</h1>
  <p class="hint">在左侧模拟桌面上移动鼠标，或点“自动扫过”用固定路径对比；滚轮上滚选父级、下滚回子级。UIA 查询按真实日志的耗时模拟（首次约 250ms，之后 12–35ms）。</p>
  <div class="presets">
    <button class="preset" data-p="now">现状</button>
    <button class="preset" data-p="ref">原始算法</button>
    <button class="preset" data-p="new">建议</button>
  </div>
  <fieldset>
    <legend>动画</legend>
    <label class="c"><input type="checkbox" id="animate"> 启用过渡</label>
    <label class="c"><input type="checkbox" id="wheelOnly"> 仅滚轮层级选择做过渡</label>
    <label class="r">小跳时长 <input type="range" id="small" min="0" max="240" step="4"><output id="smallV"></output></label>
    <label class="r">大跳时长 <input type="range" id="large" min="0" max="400" step="10"><output id="largeV"></output></label>
    <label class="r">缓动 <select id="ease">
      <option value="cubic">ease-out cubic</option>
      <option value="quint">ease-out quint</option>
      <option value="expo">ease-out expo</option>
      <option value="linear">linear</option>
    </select><span></span></label>
    <label class="r">首次出现 <select id="appear">
      <option value="snap">直接出现</option>
      <option value="fade">淡入</option>
    </select><span></span></label>
  </fieldset>
  <fieldset>
    <legend>等待新结果时</legend>
    <label class="r">离开旧框 <select id="waiting">
      <option value="clear">立即清空</option>
      <option value="hold">保持旧框</option>
    </select><span></span></label>
    <label class="r">最长保持 <input type="range" id="hold" min="50" max="1000" step="10"><output id="holdV"></output></label>
    <label class="c"><input type="checkbox" id="cache"> 已访问的叶元素立即命中（现有缓存）</label>
  </fieldset>
  <fieldset>
    <legend>防闪烁：旧点放大确认</legend>
    <label class="c"><input type="checkbox" id="gate"> 启用（不屏蔽，只要求确认）</label>
    <label class="r">面积倍数 <input type="range" id="ratio" min="2" max="16" step="0.5"><output id="ratioV"></output></label>
    <label class="r">最长等待 <input type="range" id="expand" min="0" max="400" step="10"><output id="expandV"></output></label>
    <label class="r">鼠标停住 <input type="range" id="still" min="16" max="200" step="4"><output id="stillV"></output></label>
    <p class="hint">缩小、同尺度、当前点的结果和滚轮都立即切换。只有“旧点查询、鼠标已移走”得到的放大结果先等待：另一点的结果给出同一范围、鼠标停住，或等满最长等待即采用；期间保留当前框。</p>
  </fieldset>
  <fieldset>
    <legend>观察</legend>
    <label class="r">扫过速度 <input type="range" id="speed" min="200" max="3000" step="100"><output id="speedV"></output></label>
    <div class="presets"><button class="preset" id="sweep">自动扫过</button><button class="preset" id="reset">计数清零</button></div>
    <label class="r">慢放 <input type="range" id="slow" min="1" max="10" step="1"><output id="slowV"></output></label>
    <div id="stats"></div>
  </fieldset>
  <div id="log"></div>
</aside>
<script>
"use strict";
// ---------- 模拟桌面：以 1280×720 网格书写，×1.5 成 1920×1080 物理像素 ----------
const K = 1.5;
const R = (x, y, w, h) => ({ x: x * K, y: y * K, w: w * K, h: h * K });
let uid = 0;
function node(name, cls, rect, children = [], text = "") {
  return { id: ++uid, name, cls, rect, children, text, terminal: children.length === 0 };
}
function desktop() {
  const navs = ["首页", "文档", "收藏", "共享", "回收站", "设置"].map((t, i) =>
    node("导航「" + t + "」", "nav" + (i === 1 ? " on" : ""), R(72, 98 + i * 44, 176, 36), [], t));
  const tools = ["B", "I", "U", "≡", "☰", "⌘", "↶", "↷"].map((t, i) =>
    node("工具按钮 " + t, "tbtn", R(276 + i * 44, 94, 36, 32), [], t));
  const lines = [
    "截图后自动吸附鼠标下的界面元素，滚轮可切换父子层级。",
    "选区框在元素之间移动时使用短过渡，不出现临时大框。",
    "中键可直接把当前范围贴到屏幕上。",
  ].map((t, i) => node("文本行 " + (i + 1), "line", R(300, 212 + i * 22, 540, 20), [], t));
  const card = node("卡片", "card", R(284, 158, 572, 180), [
    node("标题", "h", R(300, 172, 300, 30), [], "季度回顾"),
    node("段落", "", R(300, 210, 540, 70), lines),
    node("按钮「打开」", "btn primary", R(300, 292, 96, 32), [], "打开"),
    node("按钮「分享」", "btn", R(404, 292, 96, 32), [], "分享"),
  ]);
  const rows = ["设计评审", "接口联调", "性能测试", "发布说明", "用户反馈", "归档"].map((t, i) => {
    const y = 358 + i * 48;
    return node("列表行「" + t + "」", "row", R(284, y, 572, 46), [
      node("复选框", "check", R(300, y + 13, 20, 20)),
      node("文本「" + t + "」", "", R(334, y + 12, 300, 22), [], t),
      node("标签", "tag", R(768, y + 11, 72, 24), [], i % 2 ? "进行中" : "完成"),
    ]);
  });
  const list = node("列表", "", R(284, 352, 572, 300), rows);
  const editor = node("窗口「文档」", "window", R(60, 50, 820, 620), [
    node("标题栏", "titlebar", R(60, 50, 820, 36), [
      node("最小化", "capbtn", R(742, 50, 46, 36), [], "—"),
      node("最大化", "capbtn", R(788, 50, 46, 36), [], "☐"),
      node("关闭", "capbtn close", R(834, 50, 46, 36), [], "✕"),
    ], "文档 — 编辑器"),
    node("侧边栏", "sidebar", R(60, 86, 200, 584), navs),
    node("工具栏", "toolbar", R(260, 86, 620, 48), tools),
    node("内容区", "content", R(260, 134, 620, 536), [card, list]),
  ]);
  const toggles = ["自动吸附", "显示放大镜", "截图声音", "多屏同步", "跟随主题"].map((t, i) => {
    const y = 168 + i * 46;
    return node("设置行「" + t + "」", "row", R(932, y, 296, 44), [
      node("文本「" + t + "」", "", R(946, y + 11, 160, 22), [], t),
      node("开关", "switch" + (i % 3 === 2 ? " off" : ""), R(1170, y + 8, 48, 28)),
    ]);
  });
  const settings = node("窗口「设置」", "window", R(920, 120, 320, 440), [
    node("标题栏", "titlebar", R(920, 120, 320, 36), [
      node("关闭", "capbtn close", R(1194, 120, 46, 36), [], "✕"),
    ], "设置"),
    node("设置列表", "", R(932, 164, 296, 236), toggles),
    node("输入框", "input", R(940, 420, 280, 34), [], "快捷键：F1"),
    node("按钮「取消」", "btn", R(1028, 500, 92, 34), [], "取消"),
    node("按钮「确定」", "btn primary", R(1128, 500, 92, 34), [], "确定"),
  ]);
  const taskbar = node("任务栏", "taskbar", R(0, 680, 1280, 40),
    [0, 1, 2, 3, 4].map(i => node("任务栏图标 " + (i + 1), "tico", R(548 + i * 40, 686, 32, 28))));
  const icons = [0, 1, 2].map(i => node("桌面图标 " + (i + 1), "desk-ico", R(1188, 590 - i * 76, 64, 64)));
  return node("桌面", "", R(0, 0, 1280, 720), [...icons, editor, settings, taskbar]);
}
const root = desktop();
const stage = document.getElementById("stage");
(function build(n) {
  if (n !== root) {
    const el = document.createElement("div");
    el.className = "n " + n.cls;
    Object.assign(el.style, { left: n.rect.x + "px", top: n.rect.y + "px", width: n.rect.w + "px", height: n.rect.h + "px" });
    if (n.text) el.textContent = n.text;
    stage.insertBefore(el, document.getElementById("overlay"));
  }
  n.children.forEach(build);
})(root);

const contains = (r, p) => p.x >= r.x && p.y >= r.y && p.x < r.x + r.w && p.y < r.y + r.h;
// 最深命中在前，根在末尾，与 RaiShot ControlPath.targets 顺序一致。
function pathAt(p) {
  const path = [];
  let n = root;
  while (n) {
    path.unshift(n);
    n = [...n.children].reverse().find(c => contains(c.rect, p));
  }
  return path;
}

// ---------- 设置 ----------
const $ = id => document.getElementById(id);
// 默认 Original 算法：所有切换 140ms，查询期间保留旧框。
// 与 src/control_feedback.rs 自动模式常量一致。
const GATE = { ratio: 4, expand: 100, still: 32 };
const PRESETS = {
  now: { animate: false, wheelOnly: false, small: 32, large: 140, ease: "cubic", appear: "snap", waiting: "clear", hold: 300, cache: true, gate: false, ...GATE },
  ref: { animate: true, wheelOnly: false, small: 140, large: 140, ease: "cubic", appear: "snap", waiting: "hold", hold: 1000, cache: true, gate: false, ...GATE },
  new: { animate: true, wheelOnly: true, small: 100, large: 140, ease: "cubic", appear: "snap", waiting: "hold", hold: 1000, cache: true, gate: true, ...GATE },
};
const cfg = {};
function readCfg() {
  cfg.animate = $("animate").checked;
  cfg.wheelOnly = $("wheelOnly").checked;
  cfg.small = +$("small").value;
  cfg.large = +$("large").value;
  cfg.ease = $("ease").value;
  cfg.appear = $("appear").value;
  cfg.waiting = $("waiting").value;
  cfg.hold = +$("hold").value;
  cfg.cache = $("cache").checked;
  cfg.gate = $("gate").checked;
  cfg.ratio = +$("ratio").value;
  cfg.expand = +$("expand").value;
  cfg.still = +$("still").value;
  cfg.speed = +$("speed").value;
  cfg.slow = +$("slow").value;
  $("ratioV").textContent = "×" + cfg.ratio;
  $("expandV").textContent = cfg.expand + "ms";
  $("stillV").textContent = cfg.still + "ms";
  $("speedV").textContent = cfg.speed;
  $("smallV").textContent = cfg.small + "ms";
  $("largeV").textContent = cfg.large + "ms";
  $("holdV").textContent = cfg.hold + "ms";
  $("slowV").textContent = "×" + cfg.slow;
  for (const b of document.querySelectorAll(".preset[data-p]")) {
    const p = PRESETS[b.dataset.p];
    b.classList.toggle("on", Object.keys(p).every(k => p[k] === cfg[k]));
  }
}
function applyPreset(name) {
  const p = PRESETS[name];
  $("animate").checked = p.animate; $("wheelOnly").checked = !!p.wheelOnly; $("small").value = p.small; $("large").value = p.large;
  $("ease").value = p.ease; $("appear").value = p.appear; $("waiting").value = p.waiting;
  $("hold").value = p.hold; $("cache").checked = p.cache;
  $("gate").checked = p.gate; $("ratio").value = p.ratio; $("expand").value = p.expand;
  $("still").value = p.still;
  readCfg();
  try { localStorage.setItem("uia-anim-preset", name); } catch {}
}
document.querySelectorAll(".preset[data-p]").forEach(b => b.onclick = () => applyPreset(b.dataset.p));
document.querySelectorAll("aside input, aside select").forEach(el => el.oninput = readCfg);
$("slow").value = 1;
$("speed").value = 1200;
let saved = "new";
try { saved = localStorage.getItem("uia-anim-preset") || "new"; } catch {}
applyPreset(PRESETS[saved] ? saved : "new");

// ---------- 日志 ----------
const t0 = performance.now();
const lines = [];
function log(msg) {
  lines.push(((performance.now() - t0) / 1000).toFixed(3).padStart(8) + "s " + msg);
  if (lines.length > 13) lines.shift();
  $("log").textContent = lines.join("\n");
}

// ---------- 动画（对应 Rust ControlFeedback 的自动模式） ----------
const EASE = {
  cubic: t => 1 - Math.pow(1 - t, 3),
  quint: t => 1 - Math.pow(1 - t, 5),
  expo: t => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  linear: t => t,
};
// 大跳判定：并集 ≥ 640000 且 ≥ 2.5 倍较小者，或任一端 ≥ 1000000（DIP²，这里 1:1）。
function isLarge(a, b) {
  const sa = a.w * a.h, sb = b.w * b.h, small = Math.min(sa, sb);
  if (small <= 0 || Math.max(sa, sb) >= 1e6) return true;
  const ux = Math.min(a.x, b.x), uy = Math.min(a.y, b.y);
  const uw = Math.max(a.x + a.w, b.x + b.w) - ux, uh = Math.max(a.y + a.h, b.y + b.h) - uy;
  return uw * uh >= 640000 && uw * uh >= small * 2.5;
}
const same = (a, b) => a && b && a.x === b.x && a.y === b.y && a.w === b.w && a.h === b.h;
const fb = { visual: null, target: null, from: null, start: 0, dur: 0, alpha: 1, fadeStart: 0, frames: 0, lastDur: 0, lastKind: "" };
function setTarget(rect, why) {
  const now = performance.now();
  if (!rect) {
    if (fb.target || fb.visual) log("清空（" + why + "）");
    fb.visual = fb.target = fb.from = null;
    return;
  }
  // 同一目标的重复结果不重启过渡。
  if (same(fb.target, rect)) return;
  fb.target = rect;
  if (!fb.visual) {
    fb.visual = { ...rect };
    fb.from = null;
    fb.alpha = cfg.animate && cfg.appear === "fade" ? 0 : 1;
    fb.fadeStart = now;
    log("出现 " + why);
    return;
  }
  if (!cfg.animate || (cfg.wheelOnly && !why.startsWith("滚轮"))) { fb.visual = { ...rect }; fb.from = null; log("切换 " + why); return; }
  const large = isLarge(fb.visual, rect);
  fb.dur = (large ? cfg.large : cfg.small) * cfg.slow;
  // 从当前可见矩形重新出发，在途动画可被打断。
  fb.from = { ...fb.visual };
  fb.start = now;
  fb.frames = 0;
  fb.lastKind = large ? "大" : "小";
  fb.lastDur = fb.dur;
  log("过渡 " + fb.lastKind + " " + fb.dur + "ms " + why);
}
function stepAnimation(now) {
  if (fb.alpha < 1) fb.alpha = Math.min(1, (now - fb.fadeStart) / Math.max(1, cfg.small * cfg.slow));
  if (!fb.from || !fb.target) return;
  const t = fb.dur <= 0 ? 1 : (now - fb.start) / fb.dur;
  fb.frames++;
  if (t >= 1) { fb.visual = { ...fb.target }; fb.from = null; return; }
  const e = EASE[cfg.ease](t), f = fb.from, g = fb.target;
  const L = f.x + (g.x - f.x) * e, T = f.y + (g.y - f.y) * e;
  const Rr = f.x + f.w + (g.x + g.w - f.x - f.w) * e, B = f.y + f.h + (g.y + g.h - f.y - f.h) * e;
  // 物理像素取整，与 Rust Transition::sample 相同。
  fb.visual = { x: Math.round(L), y: Math.round(T), w: Math.max(1, Math.round(Rr) - Math.round(L)), h: Math.max(1, Math.round(B) - Math.round(T)) };
}

// ---------- 尺度跳变稳定门（候选 → 门 → 动画） ----------
const area = r => r.w * r.h;
const gate = { pending: null, lastMove: 0, absorbed: 0, jumps: 0, peers: 0, blanks: 0, last: null };
function jumpKind(from, to) {
  if (!from) return "appear";
  const k = area(to) / Math.max(1, area(from));
  return k >= cfg.ratio ? "expand" : k <= 1 / cfg.ratio ? "shrink" : "peer";
}
function commit(rect, why) {
  // 统计口径：与上一次可见框比较，清空后再出现也算一次跳变。
  const seen = jumpKind(fb.target || gate.last, rect);
  if (seen === "expand" || seen === "shrink") gate.jumps++;
  else if (seen === "peer") gate.peers++;
  if (gate.pending && !same(gate.pending.rect, rect)) gate.absorbed++;
  gate.pending = null;
  gate.last = rect;
  setTarget(rect, why);
}
// opts.immediate：滚轮等显式选择；opts.sample：结果的查询点，缺省视为当前点。
function propose(rect, why, opts = {}) {
  const now = performance.now();
  if (same(fb.target, rect)) {
    if (gate.pending) { gate.absorbed++; log("吸收 " + gate.pending.why); }
    gate.pending = null;
    return;
  }
  const kind = jumpKind(fb.target, rect);
  const current = !opts.sample || (opts.sample.x === pointer.x && opts.sample.y === pointer.y);
  if (opts.immediate || !cfg.gate || kind !== "expand" || current) return commit(rect, why);
  if (gate.pending && same(gate.pending.rect, rect)) {
    const s0 = gate.pending.sample;
    if (s0.x !== opts.sample.x || s0.y !== opts.sample.y) commit(rect, why + "（另一点确认）");
    return;
  }
  if (gate.pending) { gate.absorbed++; log("吸收 " + gate.pending.why); }
  gate.pending = { rect, why, kind, since: now, sample: opts.sample };
}
function tickGate(now) {
  const p = gate.pending;
  if (!p) return;
  if (now - p.since >= cfg.expand * cfg.slow || now - gate.lastMove >= cfg.still * cfg.slow) {
    commit(p.rect, p.why + "（稳定 " + Math.round(now - p.since) + "ms）");
  }
}
function clearTarget(why) {
  if (fb.target) gate.blanks++;
  gate.pending = null;
  setTarget(null, why);
}

// ---------- UIA 查询模拟（合并在途期间的移动，完成后立即查最新点） ----------
const pointer = { x: -1, y: -1, inside: false };
const hover = { path: null, level: 0, navigated: false };
const cache = []; // { leaf, at }
let inflight = false, cold = true, holdTimer = 0, waitingSince = 0;
function rand(a, b) { return a + Math.random() * (b - a); }
function query() {
  if (inflight || !pointer.inside) return;
  inflight = true;
  const p = { x: pointer.x, y: pointer.y };
  const latency = (cold ? 250 : rand(12, 35)) * cfg.slow;
  cold = false;
  setTimeout(() => {
    inflight = false;
    const path = pathAt(p);
    const leaf = path[0];
    // 与 path_contains_current_point 一致：叶仍含当前点才采用。
    if (pointer.inside && contains(leaf.rect, pointer)) {
      if (leaf.terminal) cache.push({ leaf, at: performance.now() });
      if (cache.length > 32) cache.shift();
      const keepNav = hover.navigated && hover.path && hover.path.includes(hover.path[hover.level]) && path.includes(hover.path[hover.level]);
      const level = keepNav ? path.indexOf(hover.path[hover.level]) : 0;
      hover.path = path; hover.level = level; hover.navigated = keepNav;
      clearTimeout(holdTimer); waitingSince = 0;
      propose(path[level].rect, "→ " + path[level].name + "（查询 " + Math.round(latency) + "ms）", { sample: p });
    }
    if (pointer.inside && (pointer.x !== p.x || pointer.y !== p.y)) query();
  }, latency);
}
function cachedLeaf() {
  if (!cfg.cache) return null;
  const now = performance.now();
  const hits = cache.filter(c => now - c.at < 750 * cfg.slow && contains(c.leaf.rect, pointer));
  hits.sort((a, b) => a.leaf.rect.w * a.leaf.rect.h - b.leaf.rect.w * b.leaf.rect.h);
  return hits[0] ? hits[0].leaf : null;
}
function onMove(e) {
  if (sweep.on) return;
  const box = stage.getBoundingClientRect();
  const s = box.width / 1920;
  moveTo(Math.floor((e.clientX - box.left) / s), Math.floor((e.clientY - box.top) / s));
}
function moveTo(x, y) {
  if (x === pointer.x && y === pointer.y) return;
  gate.lastMove = performance.now();
  pointer.x = x;
  pointer.y = y;
  pointer.inside = pointer.x >= 0 && pointer.y >= 0 && pointer.x < 1920 && pointer.y < 1080;
  const current = hover.path && hover.path[hover.level];
  if (current && contains(current.rect, pointer)) {
    // 仍在当前范围内：保持，并在后台细化到更深的子元素。
    query();
    return;
  }
  const hit = cachedLeaf();
  if (hit) {
    hover.path = pathAt(pointer); hover.level = 0; hover.navigated = false;
    propose(hit.rect, "→ " + hit.name + "（缓存）");
    query();
    return;
  }
  hover.path = null; hover.navigated = false;
  if (cfg.waiting === "clear") {
    clearTarget("离开旧框，等待查询");
  } else if (fb.target && !waitingSince) {
    waitingSince = performance.now();
    clearTimeout(holdTimer);
    holdTimer = setTimeout(() => { waitingSince = 0; if (!hover.path) clearTarget("保持超时"); }, cfg.hold * cfg.slow);
  }
  query();
}
stage.addEventListener("mousemove", onMove);
stage.addEventListener("mouseleave", () => { if (sweep.on) return; pointer.inside = false; pointer.x = pointer.y = -1; hover.path = null; clearTarget("离开桌面"); });
stage.addEventListener("wheel", e => {
  e.preventDefault();
  if (!hover.path) return;
  const step = e.deltaY < 0 ? 1 : -1; // 上滚 → 父级
  const next = Math.min(hover.path.length - 1, Math.max(0, hover.level + step));
  if (next === hover.level) return;
  hover.level = next; hover.navigated = true;
  propose(hover.path[next].rect, (step > 0 ? "滚轮父级 → " : "滚轮子级 → ") + hover.path[next].name, { immediate: true });
}, { passive: false });

// ---------- 自动扫过：固定路径穿过列表行、行间空隙、卡片与设置窗口 ----------
const SWEEP = [[320, 380], [320, 640], [600, 640], [600, 372], [820, 372], [820, 640], [700, 200], [400, 190],
  [400, 320], [960, 190], [1100, 190], [1100, 400], [960, 420], [960, 530], [1200, 530], [1200, 190], [320, 380]]
  .map(([x, y]) => [x * K, y * K]);
const sweep = { on: false, start: 0, total: 0, segs: [] };
(function () {
  let acc = 0;
  for (let i = 1; i < SWEEP.length; i++) {
    const [ax, ay] = SWEEP[i - 1], [bx, by] = SWEEP[i];
    const len = Math.hypot(bx - ax, by - ay);
    sweep.segs.push({ ax, ay, bx, by, from: acc, len });
    acc += len;
  }
  sweep.total = acc;
})();
function stepSweep(now) {
  if (!sweep.on) return;
  const d = (now - sweep.start) / 1000 * cfg.speed / cfg.slow;
  if (d >= sweep.total) { sweep.on = false; $("sweep").classList.remove("on"); log("扫过结束"); return; }
  const g = sweep.segs.find(g => d < g.from + g.len);
  const t = (d - g.from) / g.len;
  moveTo(Math.round(g.ax + (g.bx - g.ax) * t), Math.round(g.ay + (g.by - g.ay) * t));
}
$("sweep").onclick = () => {
  sweep.on = !sweep.on;
  $("sweep").classList.toggle("on", sweep.on);
  if (sweep.on) { gate.absorbed = gate.jumps = gate.peers = gate.blanks = 0; sweep.start = performance.now(); log("扫过开始"); }
};
$("reset").onclick = () => { gate.absorbed = gate.jumps = gate.peers = gate.blanks = 0; };

// ---------- 绘制：遮罩 0x00000077 + 3px #1498ff 外框 ----------
const ctx = $("overlay").getContext("2d");
let fps = 0, fpsFrames = 0, fpsAt = performance.now();
function draw(now) {
  stepSweep(now);
  tickGate(now);
  stepAnimation(now);
  ctx.clearRect(0, 0, 1920, 1080);
  ctx.fillStyle = "rgba(0,0,0,0.467)";
  ctx.beginPath();
  ctx.rect(0, 0, 1920, 1080);
  const v = fb.visual;
  if (v) ctx.rect(v.x, v.y, v.w, v.h);
  ctx.fill("evenodd");
  if (v) {
    ctx.globalAlpha = fb.alpha;
    ctx.fillStyle = "#1498ff";
    ctx.fillRect(v.x - 3, v.y - 3, v.w + 6, 3);
    ctx.fillRect(v.x - 3, v.y + v.h, v.w + 6, 3);
    ctx.fillRect(v.x - 3, v.y, 3, v.h);
    ctx.fillRect(v.x + v.w, v.y, 3, v.h);
    ctx.globalAlpha = 1;
  }
  fpsFrames++;
  if (now - fpsAt >= 500) { fps = Math.round(fpsFrames * 1000 / (now - fpsAt)); fpsFrames = 0; fpsAt = now; }
  const cur = hover.path && hover.path[hover.level];
  $("stats").textContent =
    "当前：" + (cur ? cur.name + "（层 " + hover.level + "/" + (hover.path.length - 1) + (hover.navigated ? "，滚轮" : "") + "）" : "无") +
    "\n最近过渡：" + (fb.lastKind ? fb.lastKind + "跳 " + fb.lastDur + "ms，约 " + fb.frames + " 帧" : "—") +
    "\n大小跳变：" + gate.jumps + " 次 · 同尺度：" + gate.peers + " 次 · 空白：" + gate.blanks + " 次 · 吸收：" + gate.absorbed + " 次" +
    "\n门：" + (gate.pending ? "放大待确认" : "空闲") +
    "\n刷新率：" + fps + " fps";
  requestAnimationFrame(draw);
}
$("stats").style.whiteSpace = "pre";
requestAnimationFrame(draw);

// 舞台按可用宽度缩放。
function fit() {
  const w = $("stageWrap").clientWidth;
  const s = Math.min(1, w / 1920);
  stage.style.transform = "scale(" + s + ")";
  $("stageWrap").style.height = 1080 * s + "px";
}
addEventListener("resize", fit);
fit();
</script>
</body>
</html>
