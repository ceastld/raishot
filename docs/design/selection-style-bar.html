<title>选区外观条</title>
<style>
/* 布局：上方说明与切换，中间按 1:1 DIP 复刻冻结桌面 + 选区 + 左上角外观条 + 面板，下方交互约定。配色沿用 GPUI Palette。 */
:root {
  --bg: #1d222a; --fg: #d9e2e9; --muted: #8997a6; --border: #3d4651;
  --hover: #303a45; --selected: #28473d; --accent: #40ce9d; --on-accent: #10231c;
  --page: #0f1317; --field: #161a20; --sel: #1498ff;
  --pop-shadow: 0 16px 40px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3);
  --seg-shadow: 0 1px 2px rgba(0,0,0,.35);
  --desk: #0c0e11; --desk-2: #15191e; --desk-line: #2a3038; --desk-text: #aab4bf;
  --ui: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #fafcfe; --fg: #374351; --muted: #667482; --border: #dce3e9;
    --hover: #eaf0f3; --selected: #dcefe7; --accent: #126d4e; --on-accent: #ffffff;
    --page: #e8edf1; --field: #ffffff;
    --pop-shadow: 0 14px 36px rgba(24,36,48,.18), 0 2px 6px rgba(24,36,48,.08);
    --seg-shadow: 0 1px 2px rgba(24,36,48,.12);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #fafcfe; --fg: #374351; --muted: #667482; --border: #dce3e9;
  --hover: #eaf0f3; --selected: #dcefe7; --accent: #126d4e; --on-accent: #ffffff;
  --page: #e8edf1; --field: #ffffff;
  --pop-shadow: 0 14px 36px rgba(24,36,48,.18), 0 2px 6px rgba(24,36,48,.08);
  --seg-shadow: 0 1px 2px rgba(24,36,48,.12);
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--fg); font: 14px/1.5 var(--ui); padding-block: 18px 48px; padding-inline: 16px; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; display: block; }

.wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.top h1 { font-size: 17px; font-weight: 600; margin: 0; text-wrap: balance; }
.top h1 span { color: var(--muted); font-weight: 400; margin-left: 6px; font-size: 13px; }
.ctrls { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.tog { display: inline-flex; padding: 2px; gap: 2px; border-radius: 8px; background: var(--hover); }
.tog button { height: 26px; padding: 0 11px; border-radius: 6px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.tog button:hover { color: var(--fg); }
.tog button.on { background: var(--bg); color: var(--fg); font-weight: 600; box-shadow: var(--seg-shadow); }

/* ---------- 舞台：冻结桌面 ---------- */
.stage-box { width: 100%; overflow: hidden; border-radius: 10px; border: 1px solid var(--border); }
.stage { position: relative; width: 1000px; height: 600px; transform-origin: 0 0; overflow: hidden; background: var(--desk); user-select: none; }
.desk { position: absolute; inset: 0; width: 1000px; height: 600px; font: 13px/1.5 var(--ui); color: var(--desk-text); }
.desk .win { position: absolute; left: 40px; top: 30px; width: 920px; height: 540px; background: var(--desk-2); border-radius: 8px; border: 1px solid var(--desk-line); overflow: hidden; }
.desk .tb { height: 34px; border-bottom: 1px solid var(--desk-line); display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 12px; color: #7d8894; }
.desk .tb i { width: 10px; height: 10px; border-radius: 50%; background: #3a424c; display: block; }
.desk .side { position: absolute; left: 0; top: 34px; bottom: 0; width: 190px; border-right: 1px solid var(--desk-line); padding: 14px 12px; display: flex; flex-direction: column; gap: 9px; }
.desk .side b { display: block; height: 9px; border-radius: 4px; background: #2b323b; }
.desk .main { position: absolute; left: 210px; right: 24px; top: 54px; display: flex; flex-direction: column; gap: 10px; }
.desk .main p { margin: 0; }
.desk .main .h { font-size: 18px; color: #e6edf3; font-weight: 600; }
.desk .card { border: 1px solid var(--desk-line); border-radius: 6px; padding: 10px 12px; background: #1a1f25; display: flex; gap: 12px; align-items: center; }
.desk .chart { height: 120px; border-radius: 6px; background: linear-gradient(180deg, #1c2b38, #17202a); position: relative; overflow: hidden; }
.desk .chart span { position: absolute; bottom: 0; width: 26px; border-radius: 3px 3px 0 0; background: #2f7fb8; }
.desk .ok { color: #6fd3a5; }
.desk .warn { color: #e7b85d; }
.mask { position: absolute; inset: 0; background: rgba(0,0,0,.48); pointer-events: none; }

/* 选区：内部复制一份桌面，按偏移对齐；圆角/阴影/边框只作用于这份副本。 */
.sel { position: absolute; cursor: move; }
.shot { position: absolute; inset: 0; overflow: hidden; }
.shot .desk { pointer-events: none; }
.edge { position: absolute; inset: 0; border: 1.5px solid var(--sel); pointer-events: none; }
.h8 { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: #fff; border: 1.5px solid var(--sel); transform: translate(-50%, -50%); pointer-events: none; }
.outbox { position: absolute; border: 1px dashed rgba(20,152,255,.55); pointer-events: none; }

/* ---------- 外观条 ---------- */
.bar { position: absolute; display: flex; align-items: center; gap: 2px; height: 34px; padding: 0 3px; border-radius: 9px; background: var(--bg); border: 1px solid var(--border); box-shadow: 0 6px 18px rgba(0,0,0,.35); color: var(--fg); font: 12px/1 "Segoe UI", "Microsoft YaHei UI", sans-serif; white-space: nowrap; cursor: default; z-index: 5; }
.bb { height: 28px; min-width: 28px; padding: 0 7px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; color: var(--fg); position: relative; transition: background-color .12s, color .12s; }
.bb:hover { background: var(--hover); }
.bb.open { background: var(--hover); }
.bb .num { font-variant-numeric: tabular-nums; }
.bb .x { color: var(--muted); margin: 0 1px; }
.bb .chev { width: 10px; height: 10px; stroke-width: 2; color: var(--muted); }
.out { color: var(--muted); font-variant-numeric: tabular-nums; padding: 0 6px 0 2px; font-size: 11.5px; }
.sep { width: 1px; height: 16px; background: var(--border); margin: 0 3px; flex: none; }
.fx { display: inline-flex; align-items: center; gap: 1px; }
.fxb { padding: 0 6px; color: var(--muted); }
.fxb.on { color: var(--accent); background: var(--selected); }
.fxb.on:hover { background: var(--selected); filter: brightness(1.12); }
.fxb .val { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 14px; text-align: left; }
.fxb.caret { min-width: 20px; width: 20px; padding: 0; }
.fxb.caret .chev { color: var(--muted); }
.fxb.dis { opacity: .4; pointer-events: none; }
/* 轻提示：悬停 450ms 后在条下方出现，含快捷操作说明。 */
.tip { position: absolute; z-index: 9; padding: 6px 9px; border-radius: 6px; background: var(--bg); border: 1px solid var(--border); box-shadow: 0 6px 16px rgba(0,0,0,.3); color: var(--fg); font: 11px/1.45 "Segoe UI", "Microsoft YaHei UI", sans-serif; white-space: nowrap; pointer-events: none; }
.tip em { font-style: normal; color: var(--muted); display: block; }

/* ---------- 弹出面板（共用） ---------- */
.pop { position: absolute; z-index: 6; width: 284px; background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--pop-shadow); font: 12px/1.4 "Segoe UI", "Microsoft YaHei UI", sans-serif; cursor: default; display: flex; flex-direction: column; overflow: hidden; }
.pop-h { display: flex; align-items: center; height: 40px; padding: 0 6px 0 12px; gap: 4px; flex: none; }
.pop-h b { font-size: 13px; font-weight: 600; flex: 1; }
.ib { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); }
.ib:hover { background: var(--hover); color: var(--fg); }
.pop-f { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 40px; padding: 0 8px 0 12px; border-top: 1px solid var(--border); flex: none; }
.chk { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11.5px; }
.chk:hover { color: var(--fg); }
.chk i { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--border); display: grid; place-items: center; }
.chk.on i { background: var(--accent); border-color: var(--accent); }
.chk.on i::after { content: ""; width: 7px; height: 4px; border: solid var(--on-accent); border-width: 0 0 1.6px 1.6px; transform: translateY(-1px) rotate(-45deg); }
.txtb { height: 26px; padding: 0 8px; border-radius: 6px; color: var(--muted); font-size: 11.5px; }
.txtb:hover { background: var(--hover); color: var(--fg); }

.sw { width: 32px; height: 18px; border-radius: 9px; background: var(--border); position: relative; flex: none; transition: background-color .15s; }
.sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--muted); transition: transform .15s, background-color .15s; }
.sw.on { background: var(--accent); }
.sw.on::after { transform: translateX(14px); background: var(--on-accent); }

.ctl { display: grid; grid-template-columns: 44px 1fr 54px; align-items: center; gap: 8px; height: 28px; }
.ctl > span { color: var(--muted); font-size: 11.5px; }
.ctl input[type=range] { width: 100%; accent-color: var(--accent); height: 16px; margin: 0; }
.numf { display: flex; align-items: center; height: 26px; border-radius: 6px; border: 1px solid var(--border); background: var(--field); padding: 0 6px; gap: 2px; }
.numf:focus-within { border-color: var(--accent); }
.numf input { width: 100%; min-width: 0; border: 0; background: none; color: var(--fg); font: 12px "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; text-align: right; outline: none; padding: 0; }
.numf u { text-decoration: none; color: var(--muted); font-size: 10.5px; }
.segs { display: flex; gap: 2px; padding: 2px; border-radius: 7px; background: var(--hover); }
.segs button { flex: 1; height: 24px; border-radius: 5px; color: var(--muted); font-size: 11.5px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
.segs button:hover { color: var(--fg); }
.segs button.on { background: var(--bg); color: var(--fg); box-shadow: var(--seg-shadow); font-weight: 600; }
.ticks { display: flex; gap: 4px; padding-left: 52px; }
.ticks button { height: 22px; min-width: 30px; padding: 0 6px; border-radius: 5px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; border: 1px solid var(--border); }
.ticks button:hover { color: var(--fg); background: var(--hover); }
.ticks button.on { color: var(--accent); border-color: var(--accent); background: var(--selected); }
.colors { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 8px; height: 28px; }
.colors > span { color: var(--muted); font-size: 11.5px; }
.dots { display: flex; gap: 6px; align-items: center; }
.dot { width: 20px; height: 20px; border-radius: 50%; padding: 2px; border: 1.5px solid transparent; }
.dot i { display: block; width: 100%; height: 100%; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(128,128,128,.5); }
.dot:hover { border-color: var(--muted); }
.dot.on { border-color: var(--accent); }
.dot.custom i { background: conic-gradient(#ff5368, #ffc94a, #40ce9d, #4291ff, #b86bff, #ff5368); }
.hex { margin-left: auto; color: var(--muted); font: 11px ui-monospace, Consolas, monospace; }
.note { color: var(--muted); font-size: 11px; padding: 0 12px 10px; }

/* 方案 A：纵向分组，关闭的效果只剩一行。 */
.pa .list { display: flex; flex-direction: column; }
.pa .grp { border-top: 1px solid var(--border); padding: 4px 12px; }
.pa .grp.on { padding-bottom: 12px; }
.pa .gh { display: flex; align-items: center; gap: 8px; height: 36px; width: 100%; text-align: left; }
.pa .gh .nm { font-weight: 600; flex: 1; }
.pa .gh .sum { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11.5px; }
.pa .gh svg { color: var(--muted); }
.pa .grp.on .gh svg { color: var(--accent); }
.pa .grp.flash { animation: flash 0.9s ease-out; }
@keyframes flash { from { background: var(--selected); } to { background: transparent; } }
.pa .gb { display: flex; flex-direction: column; gap: 8px; }

/* 方案 B：分页，高度固定，切页不跳。 */
.pb .tabs { display: flex; padding: 0 6px; border-bottom: 1px solid var(--border); flex: none; }
.pb .tab { flex: 1; height: 36px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--muted); position: relative; font-size: 12px; }
.pb .tab:hover { color: var(--fg); }
.pb .tab.cur { color: var(--fg); font-weight: 600; }
.pb .tab.cur::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent); }
.pb .tab .led { width: 6px; height: 6px; border-radius: 50%; background: transparent; box-shadow: inset 0 0 0 1px var(--border); }
.pb .tab .led.on { background: var(--accent); box-shadow: none; }
.pb .page { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; height: 186px; }
.pb .en { display: flex; align-items: center; justify-content: space-between; height: 28px; }
.pb .en b { font-weight: 600; }
.pb .en span { color: var(--muted); font-size: 11.5px; margin-left: 6px; font-weight: 400; }
.pb .page.off .dim { opacity: .38; pointer-events: none; }

/* ---------- 尺寸、更多 ---------- */
.mini { width: 232px; padding: 10px 12px; gap: 8px; }
.grid4 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid4 label { display: grid; grid-template-columns: 14px 1fr; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; }
.menu { width: 220px; padding: 4px; }
.menu button { display: flex; align-items: center; width: 100%; height: 30px; padding: 0 10px; border-radius: 6px; gap: 8px; font-size: 12px; }
.menu button:hover { background: var(--hover); }
.menu button kbd { margin-left: auto; color: var(--muted); font: 11px "Segoe UI", sans-serif; }
.menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 6px; }

/* 主栏占位：只为看清上下文。 */
.mainbar { position: absolute; z-index: 4; height: 40px; display: flex; align-items: center; gap: 2px; padding: 0 6px; border-radius: 9px; background: var(--bg); border: 1px solid var(--border); box-shadow: 0 6px 18px rgba(0,0,0,.35); color: var(--fg); }
.mainbar span { width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); }
.mainbar .ok { color: var(--accent); }

/* ---------- 说明区 ---------- */
.info { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px 28px; }
.info section { min-width: 0; }
.info h2 { font-size: 13.5px; margin: 0 0 6px; font-weight: 600; }
.info ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 12.5px; line-height: 1.7; }
.info b { color: var(--fg); font-weight: 600; }
.status { font-size: 12px; color: var(--muted); }
.status b { color: var(--fg); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="wrap">
  <div class="top">
    <h1 id="ttl">选区外观条<span id="sub">左上角尺寸 + 三个效果开关，细调面板放在选区外</span></h1>
    <div class="ctrls">
      <div class="tog" id="tVar"><button data-v="B" class="on">方案 B 分页</button><button data-v="A">方案 A 分组</button></div>
      <div class="tog" id="tPos"><button data-v="mid" class="on">常规</button><button data-v="top">贴顶</button><button data-v="small">小选区</button><button data-v="left">靠左贴顶</button></div>
      <div class="tog" id="tLang"><button data-v="zh" class="on">中文</button><button data-v="en">English</button></div>
      <div class="tog" id="tTheme"><button data-v="system" class="on">跟随</button><button data-v="dark">深</button><button data-v="light">浅</button></div>
    </div>
  </div>
  <div class="status" id="status"></div>
  <div class="stage-box" id="box"><div class="stage" id="stage"></div></div>
  <div class="info" id="info"></div>
</div>

<script>
(() => {
const $ = (s, r = document) => r.querySelector(s);
const W = 1000, H = 600;
const st = {
  corner: true, radius: 24, shadow: true, blur: 16, opacity: 45, shadowColor: '#000000',
  border: false, thick: 2, inside: false, borderColor: '#ffffff', remember: false,
};
const DEF = { corner: false, radius: 12, shadow: false, blur: 10, opacity: 36, shadowColor: '#000000', border: false, thick: 2, inside: false, borderColor: '#ffffff', remember: false };
const ui = { variant: 'B', lang: 'zh', pop: null, tab: 'corner', sel: { x: 300, y: 214, w: 470, h: 250 }, popSide: '', flash: null };
const POS = { mid: { x: 300, y: 214, w: 470, h: 250 }, top: { x: 300, y: 0, w: 470, h: 330 }, small: { x: 520, y: 260, w: 96, h: 64 }, left: { x: 0, y: 0, w: 420, h: 300 } };
const SHADOW_COLORS = ['#000000', '#ffffff', '#4291ff', '#ff5368'];
const BORDER_COLORS = ['#ffffff', '#000000', '#4291ff', '#ff5368'];
const PRESETS = { soft: [10, 36], standard: [16, 45], strong: [28, 55] };
const L = (zh, en) => ui.lang === 'zh' ? zh : en;

const ICON = {
  corner: '<svg class="i" viewBox="0 0 16 16"><path d="M3 13.5V8a5 5 0 0 1 5-5h5.5"/><path d="M3 13.5h0M13.5 3h0" stroke-width="2.4"/></svg>',
  shadow: '<svg class="i" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="8.5" height="8.5" rx="1.6"/><path d="M13.5 5.5v6.4a1.6 1.6 0 0 1-1.6 1.6H5.5" opacity=".55"/></svg>',
  border: '<svg class="i" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="1.6"/><rect x="5.2" y="5.2" width="5.6" height="5.6" rx=".6" stroke-dasharray="1.4 1.4" opacity=".6"/></svg>',
  chev: '<svg class="i chev" viewBox="0 0 10 10"><path d="M2.5 3.8 5 6.3l2.5-2.5"/></svg>',
  more: '<svg class="i" viewBox="0 0 16 16"><circle cx="3.5" cy="8" r=".9" fill="currentColor"/><circle cx="8" cy="8" r=".9" fill="currentColor"/><circle cx="12.5" cy="8" r=".9" fill="currentColor"/></svg>',
  reset: '<svg class="i" viewBox="0 0 16 16"><path d="M3 8a5 5 0 1 0 1.6-3.7"/><path d="M3 2.5v2.8h2.8"/></svg>',
  close: '<svg class="i" viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8"/></svg>',
  outside: '<svg class="i" viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="13" height="13" rx="2" stroke-width="2.2"/><rect x="5" y="5" width="6" height="6" rx=".5" opacity=".45" fill="currentColor" stroke="none"/></svg>',
  inside: '<svg class="i" viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" rx="1.5" stroke-width="2.2"/><rect x="1" y="1" width="14" height="14" rx="2" stroke-dasharray="1.5 1.5" opacity=".5"/></svg>',
};

// ---------- 桌面 ----------
function deskHTML() {
  const bars = [62, 88, 54, 110, 76, 96, 120, 70, 102, 84, 66, 116];
  return `<div class="desk"><div class="win"><div class="tb"><i></i><i></i><i></i><span style="margin-left:8px">Release dashboard — build 2026.10.14</span></div>
  <div class="side">${Array.from({ length: 12 }, (_, i) => `<b style="width:${60 + (i * 37) % 90}px"></b>`).join('')}</div>
  <div class="main"><p class="h">Nightly build status</p>
  <div class="card"><span class="ok">● passed</span><span>kirie-gpui · debug · 4m 12s</span><span style="margin-left:auto">x86_64-pc-windows-msvc</span></div>
  <div class="card"><span class="warn">● flaky</span><span>table_ navigation · 1 of 76 assertions</span><span style="margin-left:auto">retry 2/3</span></div>
  <div class="chart">${bars.map((h, i) => `<span style="left:${18 + i * 44}px;height:${h}px;opacity:${.55 + (i % 4) * .12}"></span>`).join('')}</div>
  <p>Frozen-desktop to selectable: 196 ms on the 2-monitor rig. OCR cold start 1.4 s with the 5.3 MB runtime pack.</p>
  <p style="color:#7d8894">Pinned windows keep vector annotations until copy, save or drag-out renders them.</p></div></div></div>`;
}

// ---------- 计算 ----------
function pad() {
  const s = st.shadow && st.blur > 0 && st.opacity > 0 ? Math.ceil(st.blur) : 0;
  const b = st.border && !st.inside ? Math.ceil(st.thick) : 0;
  return Math.max(s, b);
}
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }

function barRect() {
  const s = ui.sel, h = 34, gap = 8;
  const w = $('.bar', stage)?.offsetWidth || 260;
  let x = s.x, y = s.y - h - gap, inside = false;
  if (y < 4) { y = s.y + gap; x = s.x + gap; inside = true; }
