<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCR 结果筛选 · 交互原型</title>
<style>
:root {
  color-scheme: dark;
  --page:#101519; --surface:#1d242b; --field:#171d23; --hover:#2a353e;
  --fg:#dce5ec; --muted:#94a3af; --line:#38434d;
  --accent:#53d4ab; --accent-ink:#10251d; --selected:#234b42;
  --blue:#79afff; --blue-wash:#325e8c40; --warn:#e6bc75; --warn-wash:#8d692024;
  --paper:#20292e; --paper-fg:#d0d9df; --paper-muted:#9ba9b1;
  --shadow:0 14px 36px #0004;
  --ui:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;
}
@media(prefers-color-scheme:light) {
  :root { color-scheme:light; --page:#e9eef1; --surface:#fafcfd; --field:#f0f4f6;
    --hover:#e5ecef; --fg:#263641; --muted:#617381; --line:#d4dee4;
    --accent:#167858; --accent-ink:#fff; --selected:#dcefe6;
    --blue:#286dc4; --blue-wash:#5996dd22; --warn:#8a5a12; --warn-wash:#b0871820;
    --paper:#fff; --paper-fg:#354550; --paper-muted:#72838d; --shadow:0 14px 36px #243b5015; }
}
* { box-sizing:border-box; }
[hidden] { display:none!important; }
body { margin:0; background:var(--page); color:var(--fg); font:14px/1.5 var(--ui); }
button,input { font:inherit; }
button { color:inherit; cursor:pointer; border:0; background:none; }
button:disabled { opacity:.4; cursor:default; }
button:focus-visible,input:focus-visible,textarea:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
button:hover:enabled { background:var(--hover); }
.shell { max-width:1424px; padding:24px 28px; margin:auto; }
.intro { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:19px; }
h1 { font-size:19px; font-weight:600; margin:0; letter-spacing:.2px; }
.intro p { margin:3px 0 0; color:var(--muted); font-size:13px; }
.prototype { font-size:12px; color:var(--muted); white-space:nowrap; border:1px solid var(--line); padding:4px 9px; border-radius:5px; }
.workspace { display:grid; grid-template-columns:minmax(0,1fr) 354px; height:min(760px,calc(100dvh - 166px)); min-height:590px; border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:var(--shadow); background:var(--field); }
.image-column { min-width:0; min-height:0; display:flex; flex-direction:column; }
.image-tools { min-height:58px; padding:10px 18px; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; border-bottom:1px solid var(--line); background:var(--surface); }
.seg { display:inline-flex; background:var(--field); padding:3px; border-radius:7px; border:1px solid var(--line); }
.seg button { display:flex; align-items:center; gap:7px; height:28px; padding:0 12px; border-radius:4px; font-size:13px; }
.seg [aria-pressed="true"] { background:var(--selected); color:var(--accent); }
.subtle { font-size:12px; color:var(--muted); }
.icon { width:16px; height:16px; display:inline-block; vertical-align:middle; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
.image-well { padding:34px 32px 28px; flex:1; display:flex; align-items:center; justify-content:center; min-height:0; container-type:size; }
.capture { position:relative; width:min(100%,calc(100cqh * 830 / 620)); border:1px solid var(--blue); outline:6px solid var(--blue-wash); border-radius:2px; }
.capture-label { position:absolute; top:-26px; left:0; color:var(--muted); font-size:11px; letter-spacing:.3px; }
.canvas { position:relative; width:100%; aspect-ratio:830/620; background:var(--paper); overflow:hidden; touch-action:none; user-select:none; cursor:crosshair; }
.canvas.text-mode { cursor:text; user-select:text; }
.document-rule { position:absolute; left:10%; top:24%; width:80%; border-top:1px solid var(--line); pointer-events:none; }
.source-line { position:absolute; white-space:nowrap; color:var(--paper-fg); line-height:1.35; pointer-events:none; }
.text-mode .source-line { pointer-events:auto; }
.text-mode .source-line.filtered-source { user-select:none; pointer-events:none; }
.source-line.title { font-weight:600; letter-spacing:1px; }
.source-line.section { font-weight:600; }
.source-line.meta,.source-line.noise { color:var(--paper-muted); }
.source-line.noise { font-family:Consolas,monospace; }
.ocr-box { position:absolute; border:1px solid color-mix(in srgb,var(--blue) 24%,transparent); border-radius:2px; pointer-events:none; }
.ocr-box.selected { border-color:var(--blue); background:var(--blue-wash); }
.ocr-box.hovered { border-color:var(--blue); }
.ocr-box.filtered { border:1px dashed var(--warn); background:var(--warn-wash); }
.ocr-box .tick { position:absolute; right:-6px; top:-7px; width:14px; height:14px; display:grid; place-items:center; border-radius:3px; background:var(--blue); color:var(--paper); font-size:10px; }
.marquee { position:absolute; border:1px solid var(--blue); background:var(--blue-wash); pointer-events:none; z-index:3; }
.canvas-footer { min-height:42px; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; padding:8px 18px; border-top:1px solid var(--line); font-size:12px; color:var(--muted); }
kbd { font:11px var(--ui); border:1px solid var(--line); border-radius:3px; padding:1px 4px; margin:0 2px; }
.panel { border-left:1px solid var(--line); background:var(--surface); display:flex; flex-direction:column; min-width:0; min-height:0; }
.panel-title { height:58px; padding:0 18px; display:flex; align-items:center; gap:9px; border-bottom:1px solid var(--line); font-weight:600; }
.panel-title .count { margin-left:auto; color:var(--muted); font-size:12px; font-weight:400; }
.tabs { height:42px; display:flex; padding:0 18px; gap:24px; border-bottom:1px solid var(--line); }
.tab { display:flex; align-items:center; font-size:13px; color:var(--fg); border-bottom:2px solid var(--accent); }
.tab-note { align-self:center; font-size:12px; color:var(--muted); margin-left:auto; }
.filter { padding:15px 18px 12px; border-bottom:1px solid var(--line); }
.filter-top { display:flex; align-items:center; gap:8px; justify-content:space-between; }
.filter-label { display:flex; align-items:center; gap:9px; font-size:13px; cursor:pointer; }
.switch { appearance:none; width:30px; height:18px; flex-shrink:0; border:1px solid var(--line); border-radius:20px; margin:0; background:var(--hover); position:relative; cursor:pointer; }
.switch::after { content:""; position:absolute; width:12px; height:12px; top:2px; left:2px; background:var(--muted); border-radius:50%; transition:transform .13s; }
.switch:checked { background:var(--accent); border-color:var(--accent); }
.switch:checked::after { background:var(--accent-ink); transform:translateX(12px); }
.link { color:var(--accent); font-size:12px; padding:3px 0; border-radius:3px; }
.filter p { font-size:12px; color:var(--muted); margin:8px 0 0; }
.selection-bar { padding:11px 18px; display:flex; align-items:center; gap:8px; min-height:46px; }
.selection-bar strong { font-size:12px; font-weight:500; }
.selection-bar .link { margin-left:auto; }
.list { height:316px; min-height:190px; overflow:auto; scrollbar-width:thin; scrollbar-color:var(--line) transparent; padding:0 8px 10px; flex:1; }
.row { display:flex; align-items:center; gap:9px; width:100%; min-height:38px; padding:8px 10px; border-radius:5px; text-align:left; font-size:12px; }
.row[aria-pressed="true"] { background:var(--selected); }
.check { width:14px; height:14px; flex-shrink:0; border:1px solid var(--muted); border-radius:3px; display:grid; place-items:center; color:transparent; font-size:10px; }
.row[aria-pressed="true"] .check { color:var(--accent-ink); background:var(--accent); border-color:var(--accent); }
.row-text { min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
.review-row { margin:0 4px 6px; padding:9px 6px; border-bottom:1px solid var(--line); }
.review-main { display:flex; align-items:center; gap:8px; }
.review-main .row-text { font-size:12px; }
.reason { font-size:11px; color:var(--muted); margin-top:3px; }
.empty { padding:36px 15px; text-align:center; color:var(--muted); font-size:13px; }
.selection-actions { padding:12px 18px 14px; border-top:1px solid var(--line); background:var(--field); }
.action-top { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; font-size:12px; }
.action-top span { color:var(--muted); }
.actions { display:flex; gap:8px; }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; border:1px solid var(--line); height:34px; padding:0 12px; border-radius:6px; font-size:13px; }
.btn.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); flex:1; font-weight:600; }
.btn.primary:hover:enabled { filter:brightness(1.07); background:var(--accent); }
.btn.secondary { background:var(--surface); }
.bottom-note { font-size:11px; color:var(--muted); margin:8px 0 0; }
.below { display:flex; flex-wrap:wrap; gap:10px 20px; align-items:center; justify-content:space-between; margin-top:15px; color:var(--muted); font-size:12px; }
.legend { display:flex; flex-wrap:wrap; gap:17px; }
.legend span { display:flex; align-items:center; gap:6px; }
.swatch { width:11px; height:11px; border:1px solid var(--blue); background:var(--blue-wash); border-radius:2px; }
.swatch.muted { background:none; border-color:color-mix(in srgb,var(--blue) 35%,transparent); }
.swatch.dashed { border:1px dashed var(--warn); background:var(--warn-wash); }
.toast { position:fixed; bottom:25px; left:50%; transform:translateX(-50%); padding:10px 18px; border-radius:8px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); max-width:90vw; z-index:20; font-size:13px; }
.copy-preview { margin-top:15px; border:1px solid var(--line); border-radius:8px; background:var(--surface); padding:14px 18px; }
.copy-head { display:flex; align-items:center; justify-content:space-between; font-size:13px; }
.copy-preview textarea { display:block; background:var(--field); color:var(--fg); border:1px solid var(--line); border-radius:4px; width:100%; min-height:100px; padding:10px; margin-top:10px; font:13px/1.7 var(--ui); resize:vertical; }
@media(max-width:1050px) { .shell { padding:18px; } .workspace { grid-template-columns:minmax(0,1fr) 320px; } .image-well { padding:30px 20px 24px; } .subtle.wide { display:none; } }
@media(max-width:760px) { .shell { padding:14px; } .intro { align-items:flex-start; } h1 { font-size:17px; } .prototype { display:none; } .workspace { grid-template-columns:1fr; height:auto; min-height:0; } .panel { border-left:0; border-top:1px solid var(--line); } .list { max-height:260px; flex:auto; } .image-tools { min-height:50px; } .image-well { display:block; overflow-x:auto; padding:32px 18px 22px; container-type:normal; } .capture { width:100%; min-width:602px; } .image-column { min-height:0; } }
@media(prefers-reduced-motion:reduce) { * { transition:none!important; } }
</style>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M8 8h8v8H8z"/></symbol>
  <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 4h14M12 4v16M8 20h8"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M15 8V3H3v13h5"/></symbol>
  <symbol id="i-exclude" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M7 12h10"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="m8 4-5 5 5 5M3 9h10a7 7 0 0 1 0 14"/></symbol>
</defs></svg>
<div class="shell">
  <header class="intro">
    <div><h1>文字识别 <span style="color:var(--muted);font-weight:400">/ 结果筛选</span></h1><p>在原图里圈出想要的内容，留下有用的文字。</p></div>
    <span class="prototype">交互原型 · 文本与过滤结果均为演示</span>
  </header>
  <main class="workspace">
    <section class="image-column" aria-label="截图选区">
      <div class="image-tools">
        <div class="seg" aria-label="选择方式">
          <button type="button" id="box-mode" aria-pressed="true"><svg class="icon"><use href="#i-box"/></svg>框选多行</button>
          <button type="button" id="text-mode" aria-pressed="false"><svg class="icon"><use href="#i-text"/></svg>逐字选取</button>
        </div>
        <span class="subtle wide" id="canvas-state">拖框选择 · 点击单行也可选中</span>
      </div>
      <div class="image-well">
        <div class="capture"><span class="capture-label">截图选区 · 原图内容保持不变</span>
          <div class="canvas" id="canvas" aria-label="拖框选择文字，Ctrl 或 Shift 追加，Ctrl 点击切换单行，Alt 减选">
            <div class="document-rule"></div><div id="source"></div><div id="boxes"></div><div class="marquee" id="marquee" hidden></div>
          </div>
        </div>
      </div>
      <div class="canvas-footer"><span id="gesture-hint"><kbd>Ctrl</kbd>追加多选 / 点击切换 <kbd>Alt</kbd>减选</span><span><kbd>Esc</kbd>取消本次选择</span></div>
    </section>
    <aside class="panel" aria-label="文字识别结果">
      <div class="panel-title"><svg class="icon"><use href="#i-text"/></svg>文字识别<span class="count" id="total-count"></span></div>
      <div class="tabs"><span class="tab">逐行</span><span class="tab-note">筛选当前识别结果</span></div>
      <div class="filter">
        <div class="filter-top"><label class="filter-label"><input class="switch" type="checkbox" id="auto-filter">过滤</label></div>
      </div>
      <div class="selection-bar"><strong id="list-heading">已选 3 项</strong><button class="link" type="button" id="review">已过滤 0</button></div>
      <div class="list" id="list" aria-label="识别行，可多选"></div>
      <div class="selection-actions">
        <div class="action-top"><span id="keep-count"></span><button class="link" id="clear" type="button">取消选择</button></div>
        <div class="actions"><button class="btn secondary" type="button" id="exclude"><svg class="icon"><use href="#i-exclude"/></svg>排除所选</button><button class="btn primary" type="button" id="copy"><svg class="icon"><use href="#i-copy"/></svg><span id="copy-label">复制所选 · 3 项</span></button></div>
        <p class="bottom-note" id="scope-note">复制按原文顺序排列，不受框选先后影响。</p>
      </div>
    </aside>
  </main>
  <div class="below"><div class="legend"><span><i class="swatch muted"></i>识别范围</span><span><i class="swatch"></i>已选择</span><span><i class="swatch dashed"></i>已过滤（查看时显示）</span></div><div><button class="link" type="button" id="select-all">全选保留项</button> · <button class="link" type="button" id="undo" disabled>撤销排除 / 恢复</button></div></div>
  <section class="copy-preview" id="copy-preview" hidden aria-label="复制内容预览"><div class="copy-head"><span id="copy-status">复制内容</span><button class="link" id="close-preview" type="button">收起</button></div><textarea id="copy-content" readonly aria-label="复制文字"></textarea></section>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
(() => {
  'use strict';
  // 仅用于界面排版的演示文本，不在原型中运行 OCR 或生产筛选算法。
  const lines = [
    {text:'产品体验周报',x:84,y:68,w:280,h:38,size:28,kind:'title'},
    {text:'设计组 / 第 32 周 · 讨论稿',x:86,y:116,w:300,h:23,size:15,kind:'meta'},
    {text:'···',x:737,y:150,w:35,h:22,size:18,kind:'noise'},
    {text:'本周进展',x:86,y:180,w:124,h:27,size:18,kind:'section'},
    {text:'截图与识别流程完成第一轮整理。',x:86,y:222,w:443,h:27,size:19},
    {text:'框选需要的内容，再复制或排除。',x:86,y:258,w:443,h:27,size:19},
    {text:'原图保持完整，筛选只作用于文字结果。',x:86,y:294,w:516,h:27,size:19},
    {text:'o|',x:727,y:330,w:30,h:24,size:18,kind:'noise'},
    {text:'接下来',x:86,y:365,w:110,h:27,size:18,kind:'section'},
    {text:'01  精简主工具栏，减少重复入口。',x:86,y:408,w:465,h:27,size:18},
    {text:'02  补齐键盘操作与多屏交互。',x:86,y:444,w:426,h:27,size:18},
    {text:'03  收集真实使用中的识别反馈。',x:86,y:480,w:446,h:27,size:18},
    {text:'注：当前方案仅供讨论，时间以排期为准。',x:86,y:540,w:408,h:21,size:14,kind:'meta'},
    {text:'II',x:730,y:564,w:27,h:23,size:17,kind:'noise'},
    {text:'r',x:31,y:568,w:17,h:22,size:16,kind:'noise'},
    {text:'体验设计 / 内部资料',x:86,y:583,w:260,h:20,size:13,kind:'meta'},
    {text:'08 / 12',x:698,y:583,w:90,h:20,size:13,kind:'meta'}
  ];
  // 预置的模拟决策仅演示状态与恢复入口；实际动态策略由真实样本评测后确定。
  const demoFilterDecisions = new Map([
    [2,'疑似零散符号 · 与正文布局不一致'],
    [7,'疑似图形误识别 · 字符结构异常'],
    [13,'疑似装饰线条 · 缺少相邻文字'],
    [14,'疑似孤立碎片 · 与正文布局不一致']
  ]);
  const $ = id => document.getElementById(id);
  const st = { mode:'box', selected:new Set([4,5,6]), excluded:new Set(), restored:new Set(), auto:false, review:false, undo:[], gesture:null };
  const pctX = n => n / 830 * 100 + '%', pctY = n => n / 620 * 100 + '%';
  const autoHidden = i => st.auto && demoFilterDecisions.has(i) && !st.restored.has(i);
  const hidden = i => st.excluded.has(i) || autoHidden(i);
  const ids = () => lines.map((_,i) => i);
  const kept = () => ids().filter(i => !hidden(i));
  const filtered = () => ids().filter(hidden);
  const sortedSelection = () => ids().filter(i => st.selected.has(i) && !hidden(i));
  function button(text, className, action) { const el = document.createElement('button'); el.type='button'; el.className=className; el.textContent=text; el.addEventListener('click', action); return el; }
  function toast(message) { $('toast').textContent=message; $('toast').hidden=false; clearTimeout(toast.timer); toast.timer=setTimeout(() => $('toast').hidden=true,3200); }
  function pushUndo() { st.undo.push({ excluded:new Set(st.excluded),restored:new Set(st.restored),selected:new Set(st.selected) }); }
  function clearTextSelection() { if (window.getSelection()?.anchorNode && $('canvas').contains(window.getSelection().anchorNode)) window.getSelection().removeAllRanges(); }
  function renderSource() {
    lines.forEach((l,i) => {
      const el=document.createElement('span'); el.className='source-line '+(l.kind||''); el.textContent=l.text; el.dataset.line=i;
      Object.assign(el.style,{left:pctX(l.x),top:pctY(l.y),fontSize:(l.size/830*100)+'cqw'}); $('source').append(el);
    });
    $('canvas').style.containerType='inline-size';
  }
  function paintBoxes() {
    $('boxes').replaceChildren();
    if (st.mode==='text') return;
    lines.forEach((l,i) => {
      if (hidden(i) && !st.review) return;
      const el=document.createElement('div'); el.dataset.box=i;
      el.className='ocr-box'+(hidden(i)?' filtered':st.selected.has(i)?' selected':'');
      Object.assign(el.style,{left:pctX(l.x-4),top:pctY(l.y-2),width:pctX(l.w+8),height:pctY(l.h+4)});
      if (st.selected.has(i) && !hidden(i)) { const tick=document.createElement('span');tick.className='tick';tick.textContent='✓';el.append(tick); }
      $('boxes').append(el);
    });
  }
  function render() {
    st.selected = new Set(sortedSelection());
    const count=st.selected.size, remaining=kept(), removed=filtered();
    $('total-count').textContent=lines.length+' 项识别结果';
    $('keep-count').textContent='保留 '+remaining.length+' / '+lines.length+' 项';
    $('list-heading').textContent=st.review?'已过滤 '+removed.length+' 项':count?'已选 '+count+' 项':'全部保留项';
    $('review').textContent=st.review?'返回结果':'已过滤 '+removed.length;
    $('review').setAttribute('aria-pressed',String(st.review));
    $('clear').textContent=st.review?'恢复全部':'取消选择';
    $('clear').disabled=st.review?!removed.length:!count && !selectedText();
    $('exclude').disabled=!count || st.review || st.mode==='text';
    const selectionText = selectedText();
    $('copy-label').textContent=st.mode==='text' && selectionText?'复制所选文字':count?'复制所选 · '+count+' 项':'复制保留项 · '+remaining.length+' 项';
    $('copy').disabled=st.review || (!remaining.length && !selectionText);
    $('scope-note').textContent=st.review?'恢复后重新参与复制；原图内容始终保留。':st.mode==='text'?'逐字选择用于复制；排除整行请切回框选。':'复制按原文顺序排列，不受框选先后影响。';
    $('undo').disabled=!st.undo.length;
    $('canvas').classList.toggle('text-mode',st.mode==='text');
    $('source').querySelectorAll('[data-line]').forEach(el => el.classList.toggle('filtered-source',hidden(Number(el.dataset.line))));
    $('box-mode').setAttribute('aria-pressed',String(st.mode==='box'));
    $('text-mode').setAttribute('aria-pressed',String(st.mode==='text'));
    $('gesture-hint').innerHTML=st.mode==='text'?'在原图上拖动，选择需要复制的文字':st.review?'虚线标出已过滤范围 · 在右侧逐项恢复':'<kbd>Ctrl</kbd>追加多选 / 点击切换 <kbd>Alt</kbd>减选';
    $('canvas-state').textContent=st.review?'正在查看已过滤内容':st.mode==='text'?'拖动选择文字 · Ctrl+C 复制':'拖框选择 · 点击单行也可选中';
    const scroll=$('list').scrollTop; $('list').replaceChildren();
    const visible=st.review?removed:remaining;
    if (!visible.length) { const empty=document.createElement('div');empty.className='empty';empty.textContent=st.review?'没有已过滤的内容':'没有保留项，可以到“已过滤”里恢复。';$('list').append(empty); }
    visible.forEach(i => {
      const l=lines[i];
      if (st.review) {
        const row=document.createElement('div');row.className='review-row';const main=document.createElement('div');main.className='review-main';
        const text=document.createElement('span');text.className='row-text';text.textContent=l.text;text.title=l.text;
        const restore=button('恢复','link',() => restoreItems([i])); restore.setAttribute('aria-label','恢复 '+l.text);
        main.append(text,restore);
        row.append(main);row.addEventListener('pointerenter',() => highlight(i,true));row.addEventListener('pointerleave',() => highlight(i,false));$('list').append(row);
      } else {
        const row=button('','row',() => {if(st.mode==='text') setMode('box');st.selected.has(i)?st.selected.delete(i):st.selected.add(i);render();});
        row.setAttribute('aria-pressed',String(st.selected.has(i)));row.setAttribute('aria-label','选择 '+l.text);row.title=l.text;
        const check=document.createElement('span');check.className='check';check.textContent='✓';check.setAttribute('aria-hidden','true');
        const text=document.createElement('span');text.className='row-text';text.textContent=l.text;row.append(check,text);
        row.addEventListener('pointerenter',() => highlight(i,true));row.addEventListener('pointerleave',() => highlight(i,false));$('list').append(row);
      }
    });
    $('list').scrollTop=scroll;paintBoxes();
  }
  function highlight(i,on) { $('boxes').querySelector('[data-box="'+i+'"]')?.classList.toggle('hovered',on); }
  function setMode(mode) { if(st.mode===mode && !st.review)return;cancelGesture();clearTextSelection();st.mode=mode;st.selected.clear();st.review=false;render(); }
  function restoreItems(items) { if(!items.length)return;pushUndo();items.forEach(i => {st.excluded.delete(i);st.restored.add(i);});render();toast('已恢复 '+items.length+' 项 · 本次识别不再自动过滤这些项'); }
  function exclude() { const selected=sortedSelection();if(!selected.length||st.review||st.mode!=='box')return;pushUndo();selected.forEach(i => st.excluded.add(i));st.selected.clear();render();toast('已排除 '+selected.length+' 项 · Ctrl+Z 撤销'); }
  function undo() { const last=st.undo.pop();if(!last)return;st.excluded=last.excluded;st.restored=last.restored;st.selected=last.selected;render();toast('已撤销最近的排除 / 恢复'); }
  function selectedText() {
    const selection=window.getSelection();
    if(st.mode!=='text' || !selection?.rangeCount || selection.isCollapsed || !$('canvas').contains(selection.anchorNode) || !$('canvas').contains(selection.focusNode))return '';
    const range=selection.getRangeAt(0), parts=[];
    kept().forEach(i => {
      const node=$('source').querySelector('[data-line="'+i+'"]');if(!range.intersectsNode(node))return;
      const part=document.createRange();part.selectNodeContents(node);
      if(range.compareBoundaryPoints(Range.START_TO_START,part)>0)part.setStart(range.startContainer,range.startOffset);
      if(range.compareBoundaryPoints(Range.END_TO_END,part)<0)part.setEnd(range.endContainer,range.endOffset);
      const text=part.toString();if(text)parts.push(text);
    });
    return parts.join('\n');
  }
  async function copy() {
    if(st.review)return;
    const chosen=sortedSelection();const text=selectedText() || (chosen.length?chosen:kept()).map(i => lines[i].text).join('\n');if(!text)return;
    $('copy-content').value=text;$('copy-preview').hidden=false;
    try { await navigator.clipboard.writeText(text);$('copy-status').textContent='已复制 · 内容预览';toast('已复制文字 · 原型保留界面供继续体验'); }
    catch { $('copy-status').textContent='剪贴板不可用，请从这里手动复制';toast('浏览器未允许写入剪贴板，已展开文字供手动复制'); }
  }
  function localPoint(e) {const r=$('canvas').getBoundingClientRect();return {x:Math.max(0,Math.min(830,(e.clientX-r.left)/r.width*830)),y:Math.max(0,Math.min(620,(e.clientY-r.top)/r.height*620))};}
  function hitAt(p) {return kept().findLast(i => {const l=lines[i];return p.x>=l.x-4 && p.x<=l.x+l.w+4 && p.y>=l.y-2 && p.y<=l.y+l.h+2;});}
  function updateGesture(e) {
    const g=st.gesture;if(!g)return;g.end=localPoint(e);const x=Math.min(g.start.x,g.end.x),y=Math.min(g.start.y,g.end.y),w=Math.abs(g.start.x-g.end.x),h=Math.abs(g.start.y-g.end.y);
    g.moved ||= Math.hypot(e.clientX-g.clientX,e.clientY-g.clientY)>4;
    $('marquee').hidden=!g.moved;Object.assign($('marquee').style,{left:pctX(x),top:pctY(y),width:pctX(w),height:pctY(h)});
    if(!g.moved)return;
    const hits=kept().filter(i => {const l=lines[i];return l.x<x+w && l.x+l.w>x && l.y<y+h && l.y+l.h>y;});
    st.selected=new Set(g.add||g.subtract?g.before:[]);hits.forEach(i => g.subtract?st.selected.delete(i):st.selected.add(i));paintBoxes();
    $('list-heading').textContent='已选 '+st.selected.size+' 项';
  }
  function cancelGesture() {const g=st.gesture;if(!g)return;st.selected=g.before;st.gesture=null;$('marquee').hidden=true;if($('canvas').hasPointerCapture(g.pointer))$('canvas').releasePointerCapture(g.pointer);render();}
  $('canvas').addEventListener('pointerdown',e => {
    if(e.button!==0||st.mode!=='box'||st.review)return;
    st.gesture={start:localPoint(e),end:localPoint(e),clientX:e.clientX,clientY:e.clientY,before:new Set(st.selected),add:e.ctrlKey||e.shiftKey,toggle:e.ctrlKey,subtract:e.altKey,pointer:e.pointerId,moved:false};
    $('canvas').setPointerCapture(e.pointerId);e.preventDefault();
  });
  $('canvas').addEventListener('pointermove',updateGesture);
  $('canvas').addEventListener('pointerup',e => {
    const g=st.gesture;if(!g||e.pointerId!==g.pointer)return;updateGesture(e);
    if(!g.moved) {const hit=hitAt(localPoint(e));st.selected=new Set(g.add||g.subtract?g.before:[]);if(hit!==undefined)g.subtract || (g.toggle && g.before.has(hit))?st.selected.delete(hit):st.selected.add(hit);}
    st.gesture=null;$('marquee').hidden=true;if($('canvas').hasPointerCapture(e.pointerId))$('canvas').releasePointerCapture(e.pointerId);render();
  });
  $('canvas').addEventListener('pointercancel',cancelGesture);
  $('canvas').addEventListener('lostpointercapture',cancelGesture);
  window.addEventListener('blur',cancelGesture);
  $('box-mode').onclick=() => setMode('box');$('text-mode').onclick=() => setMode('text');
  $('auto-filter').onchange=e => {cancelGesture();st.auto=e.target.checked;clearTextSelection();render();};
  $('review').onclick=() => {cancelGesture();clearTextSelection();st.mode='box';st.review=!st.review;render();};
  $('clear').onclick=() => {if(st.review)return restoreItems(filtered());st.selected.clear();clearTextSelection();render();};
  $('select-all').onclick=() => {cancelGesture();clearTextSelection();st.review=false;st.mode='box';st.selected=new Set(kept());render();};
  $('exclude').onclick=exclude;$('copy').onclick=copy;$('undo').onclick=undo;$('close-preview').onclick=() => $('copy-preview').hidden=true;
  document.addEventListener('selectionchange',() => {if(st.mode==='text') {const text=selectedText();$('copy-label').textContent=text?'复制所选文字':'复制保留项 · '+kept().length+' 项';$('clear').disabled=!text;}});
  document.addEventListener('keydown',e => {
    if(e.target.matches('input,textarea'))return;
    if(e.key==='Escape') {if(st.gesture)cancelGesture();else {st.selected.clear();clearTextSelection();render();}e.preventDefault();}
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='c' && !st.gesture && (selectedText() || !window.getSelection()?.toString())) {e.preventDefault();copy();}
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z' && !st.gesture) {e.preventDefault();undo();}
    if(e.key==='Delete' && !st.gesture) {e.preventDefault();exclude();}
  });
  renderSource();render();
})();
</script>
</body>
</html>
