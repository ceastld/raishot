[package]
name = "omnitrigger-windows"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "Windows 低级输入 Hook 采集、消费与补发"

[dependencies]
omnitrigger-core = { path = "../core" }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
