name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Windows · Check & tests
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      RUST_MIN_STACK: "33554432"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 Rust 1.90 与 Clippy
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.90.0"
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-msvc-check
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: 安装编译缓存
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: 检查所有目标
        shell: pwsh
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: |
          cargo check --locked --all-targets
          if ($LASTEXITCODE -ne 0) { throw '编译检查失败' }

      - name: 运行核心测试
        shell: pwsh
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: |
          # 文件取消回归要求独立且已存在的目录，只存人工小流，不使用真实 OCR 缓存。
          $testRoot = Join-Path $env:RUNNER_TEMP 'ppocr-cold-preparation-cancel-20261011/draft/test-temp'
          New-Item -ItemType Directory -Force -Path $testRoot | Out-Null
          $env:RUSTSHOT_COLD_QA_ROOT = $testRoot
          cargo test --locked --lib
          if ($LASTEXITCODE -ne 0) { throw '核心测试失败' }

      - name: Clippy 报告（存量告警暂不阻断）
        id: clippy
        continue-on-error: true
        shell: pwsh
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy 仍有待处理项，详见本步骤日志' }

      - name: 标注 Clippy 待处理项
        if: always() && steps.clippy.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Output '::warning::Clippy 存在待处理项；编译与单元测试为必过门槛，Clippy 暂作为报告。'
          'Clippy 尚有存量告警，未作为发布阻断条件；完整诊断见 Clippy 步骤日志。' >> $env:GITHUB_STEP_SUMMARY
