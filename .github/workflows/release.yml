# 发版构建：Release 编译三个 EXE，打包 app-local VC++ 运行库与固定 ONNX Runtime；
# OCR 模型与字典不进包，由程序运行时从固定官方源按需下载并校验。
name: Release
run-name: Release · ${{ github.event_name == 'push' && github.ref_name || inputs.package_version || '验包' }}

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      package_version:
        description: "可留空使用 Cargo 版本；仅构建验包，不创建 Release"
        required: false
        type: string

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}-${{ inputs.package_version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: 校验版本与发布说明
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.package_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 确定包版本
        id: version
        shell: pwsh
        env:
          PACKAGE_VERSION_INPUT: ${{ inputs.package_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cargo = Get-Content -LiteralPath Cargo.toml -Raw
          $package = [regex]::Match($cargo, '(?ms)^\[package\]\s*\r?\n(?<body>.*?)(?=^\[|\z)')
          $productVersion = [regex]::Match($package.Groups['body'].Value, '(?m)^version\s*=\s*"(?<version>[^"\r\n]+)"\s*$')
          if (-not $package.Success -or -not $productVersion.Success) {
            throw '无法从 Cargo.toml 的 [package] 读取产品版本'
          }
          $version = $productVersion.Groups['version'].Value
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } elseif (-not [string]::IsNullOrWhiteSpace($env:PACKAGE_VERSION_INPUT)) {
            $version = $env:PACKAGE_VERSION_INPUT
          }
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "包版本须为三段数字：$version"
          }
          if ($version -ne $productVersion.Groups['version'].Value) {
            throw "包版本 $version 与 Cargo.toml 产品版本 $($productVersion.Groups['version'].Value) 不一致"
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $escapedVersion = [regex]::Escape($version)
            $pattern = '(?ms)^##[ \t]+(?:\[' + $escapedVersion + '\]|v?' + $escapedVersion + ')(?=[ \t\r\n（(]|$)[^\r\n]*\r?\n(?<notes>.*?)(?=^##[ \t]+|\z)'
            $section = [regex]::Match((Get-Content CHANGELOG.md -Raw), $pattern)
            if (-not $section.Success -or [string]::IsNullOrWhiteSpace($section.Groups['notes'].Value)) {
              throw "CHANGELOG.md 缺少 $version 的发布说明"
            }
          }
          "package_version=$version" >> $env:GITHUB_OUTPUT
          "包版本：$version；提交：$env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY

  checks:
    needs: prepare
    uses: ./.github/workflows/ci.yml

  build:
    needs: prepare
    runs-on: windows-2025
    outputs:
      version: ${{ needs.prepare.outputs.version }}
    timeout-minutes: 240
    env:
      CARGO_TERM_COLOR: always
      RUST_MIN_STACK: "33554432"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 Rust 1.90
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.90.0"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-msvc-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      # Cargo 产物缓存默认排除仓库内的 path 依赖；sccache 按内容复用 GPUI、codec 等库，
      # 不依赖新 checkout 的文件时间。只在构建步骤设置 RUSTC_WRAPPER，保留现有依赖缓存键。
      - name: 安装编译缓存
        id: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: 缓存 ONNX Runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ocr-runtime
          key: ort-windows-x64-v1-${{ hashFiles('dependencies/ppocr-cpu.json') }}

      - name: 准备 VC++ 运行库与 ONNX Runtime
        id: deps
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -property installationPath
          $redist = Get-ChildItem (Join-Path $vs 'VC\Redist\MSVC') -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Get-ChildItem (Join-Path $_.FullName 'x64') -Directory -Filter 'Microsoft.VC*.CRT' } |
            Select-Object -First 1
          if (-not $redist) { throw '未找到 x64 VC++ 可再发行运行库目录' }
          "runtime_directory=$($redist.FullName)" >> $env:GITHUB_OUTPUT

          $manifest = Get-Content dependencies/ppocr-cpu.json -Raw | ConvertFrom-Json
          $out = Join-Path $env:RUNNER_TEMP 'ocr-runtime'
          $ready = $true
          foreach ($file in $manifest.runtime.files) {
            $path = Join-Path $out $file.name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or
                (Get-Item -LiteralPath $path).Length -ne [int64]$file.bytes -or
                (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ne $file.sha256.ToUpperInvariant()) {
              $ready = $false
              break
            }
          }
          if ($ready) {
            Write-Host '复用已按固定清单校验的 ONNX Runtime'
            "ocr_runtime_directory=$out" >> $env:GITHUB_OUTPUT
            exit 0
          }

          # 镜像失败时回退固定官方源，只提取必需成员；缓存命中后不再下载压缩包。
          $archive = $manifest.runtime.archive
          $zip = Join-Path $env:RUNNER_TEMP $archive.name
          $verified = $false
          $sources = @(@{ url = $archive.url; bytes = $archive.bytes; sha256 = $archive.sha256 })
          if ($archive.upstream_url -and $archive.upstream_url -ne $archive.url) {
            $sources += @{ url = $archive.upstream_url; bytes = $archive.upstream_bytes; sha256 = $archive.upstream_sha256 }
          }
          foreach ($source in $sources) {
            $url = $source.url
            try {
              Invoke-WebRequest -Uri $url -OutFile $zip -TimeoutSec 60
              $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
              if ((Get-Item $zip).Length -ne [int64]$source.bytes -or $hash -ne $source.sha256.ToUpperInvariant()) {
                throw 'ONNX Runtime 压缩包与固定清单不符'
              }
              $verified = $true
              break
            } catch {
              Write-Warning "ONNX Runtime 下载或校验失败：$url；$($_.Exception.Message)"
            }
          }
          if (-not $verified) { throw '未取得校验通过的 ONNX Runtime' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          New-Item -ItemType Directory -Force $out | Out-Null
          $zipArchive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            foreach ($file in $manifest.runtime.files) {
              $entry = $zipArchive.GetEntry($file.member)
              if (-not $entry) { throw "压缩包缺少 $($file.member)" }
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, (Join-Path $out $file.name), $true)
            }
          } finally { $zipArchive.Dispose() }
          "ocr_runtime_directory=$out" >> $env:GITHUB_OUTPUT

      - name: Release 构建
        shell: pwsh
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          CARGO_INCREMENTAL: "0"
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          try {
            ./build.ps1 -Jobs 2 -Timings
          } finally {
            $timer.Stop()
            "Release 构建耗时：$([math]::Round($timer.Elapsed.TotalSeconds, 1)) 秒；$env:NUMBER_OF_PROCESSORS 个逻辑 CPU；LTO off，16 个代码生成单元。" |
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }

      - name: 编译缓存统计
        if: always() && steps.sccache.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          '```text' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          & $env:SCCACHE_PATH --show-stats | Tee-Object -Variable stats
          $stats | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: 保存构建耗时报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RaiShot-build-timings-${{ github.run_attempt }}
          path: target/cargo-timings/
          if-no-files-found: ignore
          retention-days: 7

      - name: 检查 CLI 启动
        shell: pwsh
        run: |
          & ./target/release/raishot-cli.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Release CLI 无法正常启动' }

      - name: 打包
        id: package
        shell: pwsh
        run: |
          $result = ./Tools/package.ps1 `
            -SourceDirectory target/release `
            -OutputDirectory dist/ci `
            -PackageName rustshot `
            -PackageVersion '${{ needs.prepare.outputs.version }}' `
            -RuntimeDirectory '${{ steps.deps.outputs.runtime_directory }}' `
            -OcrRuntimeDirectory '${{ steps.deps.outputs.ocr_runtime_directory }}' `
            -ReadmePath assets/PORTABLE-README.txt `
            -IncludeProjectNotices
          $result | Format-List
          $checksum = "$($result.zip_path).sha256"
          "$($result.sha256)  $([IO.Path]::GetFileName($result.zip_path))" | Set-Content -LiteralPath $checksum -Encoding utf8NoBOM
          "zip_path=$($result.zip_path)" >> $env:GITHUB_OUTPUT
          "checksum_path=$checksum" >> $env:GITHUB_OUTPUT

      - name: 验证便携包启动
        shell: pwsh
        env:
          PACKAGE_ZIP: ${{ steps.package.outputs.zip_path }}
        run: |
          $unpacked = Join-Path $env:RUNNER_TEMP 'package-smoke'
          Expand-Archive -LiteralPath $env:PACKAGE_ZIP -DestinationPath $unpacked
          & (Join-Path $unpacked 'raishot-cli.exe') --help
          if ($LASTEXITCODE -ne 0) { throw '解压后的便携包 CLI 无法启动' }

      # 安装包从便携 ZIP 重新展开，与 ZIP 文件逐件相同；Inno Setup 固定版本并按 SHA256 校验后免注册安装到临时目录。
      - name: 构建安装包
        id: installer
        shell: pwsh
        env:
          INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe
          INNO_SHA256: A549929319F9120716677C685535CA4671E4B937B5FDC87E2585F32D8EB30E8C
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
          PACKAGE_ZIP: ${{ steps.package.outputs.zip_path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri $env:INNO_URL -OutFile $setup -TimeoutSec 120
          if ((Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash -ne $env:INNO_SHA256) {
            throw 'Inno Setup 安装程序与固定 SHA256 不符'
          }
          $inno = Join-Path $env:RUNNER_TEMP 'inno'
          $process = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/PORTABLE=1', '/NOICONS', "/DIR=$inno")
          if ($process.ExitCode -ne 0) { throw "Inno Setup 安装失败：$($process.ExitCode)" }
          $source = Join-Path $env:RUNNER_TEMP 'installer-source'
          Expand-Archive -LiteralPath $env:PACKAGE_ZIP -DestinationPath $source
          $output = (New-Item -ItemType Directory -Force -Path 'dist/ci').FullName
          & (Join-Path $inno 'ISCC.exe') /Qp "/DAppVersion=$env:PACKAGE_VERSION" "/DSourceDir=$source" "/DOutputDir=$output" installer/raishot.iss
          if ($LASTEXITCODE -ne 0) { throw '安装包编译失败' }
          $path = Join-Path $output "RaiShot-$env:PACKAGE_VERSION-setup-x64.exe"
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "未生成安装包：$path" }
          $checksum = "$path.sha256"
          "$((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($path))" |
            Set-Content -LiteralPath $checksum -Encoding utf8NoBOM
          "setup_path=$path" >> $env:GITHUB_OUTPUT
          "checksum_path=$checksum" >> $env:GITHUB_OUTPUT

      - name: 验证安装与卸载
        shell: pwsh
        env:
          SETUP_PATH: ${{ steps.installer.outputs.setup_path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'install-smoke\RaiShot'
          $log = Join-Path $env:RUNNER_TEMP 'install-smoke.log'
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $appPaths = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\App Paths\raishot.exe'
          $userPath = { [Environment]::GetEnvironmentVariable('Path', 'User') -split ';' }
          $process = Start-Process -FilePath $env:SETUP_PATH -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dir", '/TASKS=autostart,clipath', "/LOG=$log")
          if ($process.ExitCode -ne 0) { Get-Content $log; throw "静默安装失败：$($process.ExitCode)" }
          if (-not (Select-String -LiteralPath $log -SimpleMatch '--exit exit code: 0' -Quiet)) {
            Get-Content $log; throw '安装前未能调用 --exit'
          }
          & (Join-Path $dir 'raishot-cli.exe') --help
          if ($LASTEXITCODE -ne 0) { throw '安装后的 CLI 无法启动' }
          $expected = "`"$dir\raishot.exe`" --tray"
          if ((Get-ItemProperty -Path $run -Name RaiShot).RaiShot -ne $expected) { throw "开机启动项不符：$expected" }
          if ((Get-ItemProperty -Path $appPaths).'(default)' -ne "$dir\raishot.exe") { throw 'App Paths 登记不符' }
          if ((& $userPath) -notcontains $dir) { throw '用户 PATH 未加入安装目录' }

          $uninstaller = Join-Path $dir 'unins000.exe'
          Start-Process -FilePath $uninstaller -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          # 卸载程序会复制到临时目录后再执行，等其删除自身。
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path -LiteralPath $uninstaller) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          if (Test-Path -LiteralPath $dir) { Get-ChildItem -Recurse $dir; throw '卸载后仍残留程序目录' }
          if (Get-ItemProperty -Path $run -Name RaiShot -ErrorAction SilentlyContinue) { throw '卸载后仍残留开机启动项' }
          if (Test-Path -LiteralPath $appPaths) { throw '卸载后仍残留 App Paths' }
          if ((& $userPath) -contains $dir) { throw '卸载后用户 PATH 仍含安装目录' }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RaiShot-${{ needs.prepare.outputs.version }}
          path: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.checksum_path }}
            ${{ steps.installer.outputs.setup_path }}
            ${{ steps.installer.outputs.checksum_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: 发布 GitHub Release
    needs: [checks, build]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: RaiShot-${{ needs.build.outputs.version }}
          path: release-assets

      - name: 校验并发布
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path 'release-assets' "RaiShot.$env:RELEASE_VERSION.0.zip"
          $setup = Join-Path 'release-assets' "RaiShot-$env:RELEASE_VERSION-setup-x64.exe"
          $assets = @()
          foreach ($file in @($setup, $zip)) {
            $checksum = "$file.sha256"
            $expected = ((Get-Content -LiteralPath $checksum -Raw).Trim() -split '\s+')[0]
            if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $expected) {
              throw "下载的 $([IO.Path]::GetFileName($file)) 与 SHA256 校验文件不一致"
            }
            $assets += @($file, $checksum)
          }
          # 列表接口包含有权限读取的草稿；按 tag 的 REST 接口不能可靠查到草稿。
          $pages = gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw '查询已有 Release 失败' }
          $matches = @(foreach ($page in ($pages | ConvertFrom-Json -NoEnumerate)) {
            foreach ($candidate in $page) {
              if ($candidate.tag_name -eq $env:GITHUB_REF_NAME) { $candidate }
            }
          })
          if ($matches.Count -gt 1) {
            throw '存在多个同标签的 Release，请先核对草稿'
          }
          $release = $matches | Select-Object -First 1
          if (-not $release) {
            $escapedVersion = [regex]::Escape($env:RELEASE_VERSION)
            $pattern = '(?ms)^##[ \t]+(?:\[' + $escapedVersion + '\]|v?' + $escapedVersion + ')(?=[ \t\r\n（(]|$)[^\r\n]*\r?\n(?<notes>.*?)(?=^##[ \t]+|\z)'
            $section = [regex]::Match((Get-Content CHANGELOG.md -Raw), $pattern)
            if (-not $section.Success -or [string]::IsNullOrWhiteSpace($section.Groups['notes'].Value)) {
              throw '缺少对应版本的发布说明'
            }
            $notes = Join-Path $env:RUNNER_TEMP 'release-notes.txt'
            Set-Content -LiteralPath $notes -Value $section.Groups['notes'].Value.Trim() -Encoding utf8NoBOM
            gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --verify-tag --draft `
              --title "RaiShot $env:RELEASE_VERSION" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw '创建 Release 草稿失败' }
            $apiUrl = gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --json apiUrl --jq .apiUrl
            if ($LASTEXITCODE -ne 0) { throw '定位 Release 草稿失败' }
            $releaseJson = gh api $apiUrl
            if ($LASTEXITCODE -ne 0) { throw '读取 Release 草稿失败' }
            $release = $releaseJson | ConvertFrom-Json
          }
          foreach ($path in $assets) {
            $name = [IO.Path]::GetFileName($path)
            $existing = $release.assets | Where-Object { $_.name -eq $name } | Select-Object -First 1
            if ($existing) {
              $digest = 'sha256:' + (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($existing.digest -ne $digest -or $existing.size -ne (Get-Item -LiteralPath $path).Length) {
                throw "同版本资产内容不同或无法核验，禁止覆盖：$name；请使用新版本"
              }
            } elseif ($release.draft) {
              gh release upload $env:GITHUB_REF_NAME $path --repo $env:GITHUB_REPOSITORY
              if ($LASTEXITCODE -ne 0) { throw "上传 Release 资产失败：$name" }
            } else {
              throw "已发布版本缺少资产 $name，禁止修改已发布内容"
            }
          }
          if ($release.draft) {
            gh release edit $env:GITHUB_REF_NAME --draft=false --latest --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw '发布 Release 草稿失败' }
          }
          "已发布：https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:GITHUB_REF_NAME" >> $env:GITHUB_STEP_SUMMARY
